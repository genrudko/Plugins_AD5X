# Stage 4 AD5X hardware-spike configuration.
# Keep the real upstream launch narrow: one local Moonraker and AD5X-specific
# integration only where stock KlipperScreen has no equivalent surface.
# Physical panel blanking is owned by the AD5X launcher/backlight sysfs contract.

[main]
default_printer: AD5X
show_cursor: False
24htime: True
use_dpms: False
screen_blanking: off

[printer AD5X]
moonraker_host: 127.0.0.1
moonraker_port: 7125
moonraker_ssl: False

# Plugins_AD5X provides this panel from the canonical backend snapshot.  It does
# not talk to the IFS serial device and therefore preserves Z-Mod ownership.
[menu __main ifs]
name: IFS
icon: extrude
panel: ad5x_ifs

# The upstream Camera panel hard-imports python-mpv. Stage 4 deliberately does
# not ship libmpv/python-mpv yet, so do not expose a button that deterministically
# terminates the PoC session. Camera support is a separate runtime capability.
[menu __main more camera]
enable: False
