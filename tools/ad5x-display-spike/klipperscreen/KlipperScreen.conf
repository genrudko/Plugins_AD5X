# Stage 4 AD5X hardware-spike configuration.
# Keep the first real upstream launch deliberately narrow: one local Moonraker,
# stock upstream UI, no desktop/windowed geometry overrides.
# Physical panel blanking is owned by the AD5X launcher/backlight sysfs contract.

[main]
default_printer: AD5X
show_cursor: False
24htime: True
use_dpms: False
screen_blanking: off

[printer AD5X]
moonraker_host: 127.0.0.1
moonraker_port: 7125
moonraker_ssl: False

# The upstream Camera panel hard-imports python-mpv. Stage 4 deliberately does
# not ship libmpv/python-mpv yet, so do not expose a button that deterministically
# terminates the PoC session. Camera support is a separate runtime capability.
[menu __main more camera]
enable: False
