# AD5X custom integration. Upstream repository files are not edited.

# Read-only Plugins_AD5X bridge to the in-memory Z-Mod IFS state.  The adapter
# never opens /dev/ttyS4; Z-Mod remains the sole owner of the IFS protocol.
[ad5x_ifs]

[gcode_shell_command ad5x_custom_status]
command: /opt/config/mod_data/plugins/ad5x_custom/install.sh --status
verbose: True
timeout: 60

[gcode_shell_command ad5x_custom_apply]
command: /opt/config/mod_data/plugins/ad5x_custom/install.sh --apply-only
verbose: True
timeout: 300

[delayed_gcode ad5x_custom_power_on_notify]
gcode:
    _NOTIFY MSG="Принтер включен" TYPE=on DELAYED=1

[gcode_macro AD5X_CUSTOM_STATUS]
description: Проверить чистые кастомизации AD5X
gcode:
    RUN_SHELL_COMMAND CMD=ad5x_custom_status

[gcode_macro AD5X_CUSTOM_APPLY]
description: Повторно применить интеграцию AD5X
gcode:
    RUN_SHELL_COMMAND CMD=ad5x_custom_apply

[gcode_shell_command ad5x_timelapse_camera2_capture]
command: /opt/config/mod_data/timelapse_camera2_capture.sh
timeout: 2.
verbose: False

[gcode_shell_command ad5x_timelapse_telegram_start]
command: /opt/config/mod_data/start_timelapse_watcher.sh
timeout: 5.
verbose: False
