# Plugins AD5X Z Calibration compatibility activation seam.
#
# This file intentionally defines no macros and does not own
# _USER_START_PRINT. installer/z_calibration_runtime.sh deploys the canonical
# z_calibration_rc_policy.cfg as a managed generated runtime asset and adds its
# include only after the winning user extension owner has been proven.
#
# Keeping this stable include target preserves the existing installer/config
# activation seam while preventing the old backend-driven hook implementation
# from reappearing during apply/update/repair.
