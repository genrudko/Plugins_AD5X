# Plugins AD5X Z Calibration lifecycle hook.
#
# Z-Mod deliberately calls _USER_START_PRINT after its own _START_PRINT.  This
# late hook adopts the offset that Z-Mod already selected; it does not perform
# probing, motion, or direct SET_GCODE_OFFSET itself.

[gcode_macro _USER_START_PRINT]
variable_plugins_ad5x_z_hook: 1
gcode:
    {% set screen = printer["gcode_macro _SCREEN"].screen %}
    {% set load_zoffset = printer.save_variables.variables['load_zoffset']|default(1)|int %}
    {% set zoffset = printer["gcode_macro _START_PRINT"].zzoffset|default(99.0)|float %}

    {% if load_zoffset == 1 and screen == False %}
        {action_call_remote_method("plugins_ad5x_z_job_start",
                                   mode="global",
                                   z_offset=99.0)}
    {% elif zoffset != 99.0 %}
        {action_call_remote_method("plugins_ad5x_z_job_start",
                                   mode="job",
                                   z_offset=zoffset)}
    {% else %}
        {action_call_remote_method("plugins_ad5x_z_job_start",
                                   mode="none",
                                   z_offset=99.0)}
    {% endif %}
