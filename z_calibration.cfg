# Plugins AD5X Z Calibration lifecycle hook.
#
# Z-Mod deliberately completes its own _START_PRINT first. In the ordinary
# owner path (global Z-offset + saved mesh), Z-Mod therefore remains the proven
# motion/contact engine while Plugins AD5X performs a late, fail-closed policy
# check before the print proceeds. Plugins AD5X does not add a second probe or
# motion implementation here and does not own the Z-offset write in RC v1.
#
# RC v1 is evidence-bound to the post-adjustment saved `auto` mesh and to the
# clean Gate B/C hardware runs recorded on 2026-08-17. Large/mismatched cases
# restore the persistent global Z-offset and abort instead of accepting a huge
# transient Auto-Z correction.

[gcode_macro _AD5X_Z_POLICY_ABORT_MODE]
gcode:
    {% set mode = params.MODE|default(-1)|int %}
    {action_raise_error("Plugins AD5X Z policy: MESH_TEST=%d is not accepted for unattended saved+check. Required: SAVE_ZMOD_DATA MESH_TEST=3" % mode)}

[gcode_macro _AD5X_Z_POLICY_ABORT_PROFILE]
gcode:
    {% set profile = params.PROFILE|default("none")|string %}
    {action_raise_error("Plugins AD5X Z policy: active saved mesh '%s' is not the validated 'auto' profile. Run/accept a full calibration before unattended printing." % profile)}

[gcode_macro _AD5X_Z_POLICY_ABORT_REFERENCE]
gcode:
    {% set current = params.CURRENT|default(999.0)|float %}
    {% set expected = params.EXPECTED|default(0.0)|float %}
    {action_raise_error("Plugins AD5X Z policy: saved auto reference changed (current %.6f, accepted %.6f). Full calibration / policy review required." % (current, expected))}

[gcode_macro _AD5X_Z_POLICY_ABORT_ALIGNMENT]
gcode:
    {% set delta = params.DELTA|default(0.0)|float %}
    {% set limit = params.LIMIT|default(0.0)|float %}
    {action_raise_error("Plugins AD5X Z policy: Auto-Z delta %.4f mm exceeds accepted %.4f mm envelope. Hardware change suspected; unattended print aborted." % (delta, limit))}

[gcode_macro _USER_START_PRINT]
variable_plugins_ad5x_z_hook: 1
variable_plugins_ad5x_policy_id: "zcal-saved-check-v1-20260817"
variable_plugins_ad5x_max_auto_alignment: 0.120000
variable_plugins_ad5x_saved_profile: "auto"
variable_plugins_ad5x_saved_reference: -1.925833
variable_plugins_ad5x_reference_tolerance: 0.000500
gcode:
    {% set screen = printer["gcode_macro _SCREEN"].screen %}
    {% set load_zoffset = printer.save_variables.variables['load_zoffset']|default(1)|int %}
    {% set zoffset = printer["gcode_macro _START_PRINT"].zzoffset|default(99.0)|float %}

    {% set mesh_test = printer.save_variables.variables['mesh_test']|default(1)|int %}
    {% set print_leveling = printer.save_variables.variables['print_leveling']|default(0)|int %}
    {% set force_kamp = printer["gcode_macro _START_PRINT"].zforce_kamp|default(False) %}
    {% set force_leveling = printer["gcode_macro _START_PRINT"].zforce_leveling|default(False) %}
    {% set auto_alignment = printer["gcode_macro _TEST_POINT"].temp_z_offset|default(0.0)|float %}
    {% set active_profile = printer.bed_mesh.profile_name|default("")|string %}
    {% set matrix = printer.bed_mesh.probed_matrix|default([]) %}

    {% set ns = namespace(reference_ok=False, current_reference=999.0) %}
    {% if matrix|length == 5 and matrix[2]|length == 5 %}
        {% set ns.current_reference = matrix[2][2]|float %}
        {% if (ns.current_reference - plugins_ad5x_saved_reference)|abs <= plugins_ad5x_reference_tolerance %}
            {% set ns.reference_ok = True %}
        {% endif %}
    {% endif %}

    # Owner RC path: Z-Mod global persistent offset + saved `auto` mesh +
    # pre-print AutoZOffset. Force-KAMP/full-leveling paths intentionally stay
    # outside this evidence-bound saved+check guard.
    {% set saved_check_path = (print_leveling == 0 and not force_kamp and not force_leveling) %}

    {% if load_zoffset == 1 and screen == False %}
        {% if saved_check_path %}
            {% if mesh_test != 3 %}
                LOAD_GCODE_OFFSET
                _AD5X_Z_POLICY_ABORT_MODE MODE={mesh_test}
            {% elif active_profile != plugins_ad5x_saved_profile %}
                LOAD_GCODE_OFFSET
                _AD5X_Z_POLICY_ABORT_PROFILE PROFILE="{active_profile}"
            {% elif not ns.reference_ok %}
                LOAD_GCODE_OFFSET
                _AD5X_Z_POLICY_ABORT_REFERENCE CURRENT={ns.current_reference} EXPECTED={plugins_ad5x_saved_reference}
            {% elif auto_alignment|abs >= plugins_ad5x_max_auto_alignment %}
                LOAD_GCODE_OFFSET
                _AD5X_Z_POLICY_ABORT_ALIGNMENT DELTA={auto_alignment} LIMIT={plugins_ad5x_max_auto_alignment}
            {% else %}
                RESPOND PREFIX="info" MSG="Plugins AD5X saved+check PASS: policy={plugins_ad5x_policy_id} mesh={active_profile} reference={ns.current_reference|round(6)} Auto-Z={auto_alignment|round(4)} mm"
                {action_call_remote_method("plugins_ad5x_z_job_start",
                                           mode="global",
                                           z_offset=99.0)}
            {% endif %}
        {% else %}
            RESPOND PREFIX="info" MSG="Plugins AD5X saved+check policy bypassed: this job requested a fresh mesh/KAMP path"
            {action_call_remote_method("plugins_ad5x_z_job_start",
                                       mode="global",
                                       z_offset=99.0)}
        {% endif %}
    {% elif zoffset != 99.0 %}
        {action_call_remote_method("plugins_ad5x_z_job_start",
                                   mode="job",
                                   z_offset=zoffset)}
    {% else %}
        {action_call_remote_method("plugins_ad5x_z_job_start",
                                   mode="none",
                                   z_offset=99.0)}
    {% endif %}
