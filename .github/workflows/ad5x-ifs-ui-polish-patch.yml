name: AD5X IFS UI polish patch

on:
  pull_request:
    branches:
      - ad5x-klipperscreen-spike
    paths:
      - '.github/workflows/ad5x-ifs-ui-polish-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply hardware-observed IFS UI polish
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tools/ad5x-display-spike/klipperscreen/ad5x_ifs_panel.py')
          s = p.read_text()

          old = '''        for slot in range(1, 5):
              card, widgets = self._make_slot_card(slot)
              self._slot_widgets[slot] = widgets
              col = (slot - 1) % 2
              row = (slot - 1) // 2
              grid.attach(card, col, row, 1, 1)
          root.pack_start(grid, True, True, 0)

          action_bar = Gtk.Box(
'''.replace('          ', '        ')
          new = '''        for slot in range(1, 5):
              card, widgets = self._make_slot_card(slot)
              self._slot_widgets[slot] = widgets
              grid.attach(card, slot - 1, 0, 1, 1)
          root.pack_start(grid, True, True, 0)

          self.path = Gtk.Label(
              label="Тракт: —",
              hexpand=True,
              halign=Gtk.Align.START,
              valign=Gtk.Align.CENTER,
              xalign=0,
          )
          self.path.set_ellipsize(Pango.EllipsizeMode.END)
          root.pack_start(self.path, False, False, 0)

          action_bar = Gtk.Box(
'''.replace('          ', '        ')
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        for button in (self.action_select, self.action_load, self.action_unload):
              button.set_sensitive(False)
              action_bar.pack_end(button, False, False, 0)
'''.replace('          ', '        ')
          new = '''        for button in (self.action_select, self.action_load, self.action_unload):
              button.set_sensitive(False)
              action_bar.pack_start(button, False, False, 0)
'''.replace('          ', '        ')
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        box = Gtk.Box(
              orientation=Gtk.Orientation.VERTICAL,
              spacing=2,
              margin=5,
              hexpand=True,
              vexpand=True,
          )
'''.replace('          ', '        ')
          new = '''        box = Gtk.Box(
              orientation=Gtk.Orientation.VERTICAL,
              spacing=3,
              margin=7,
              hexpand=True,
              vexpand=True,
          )
'''.replace('          ', '        ')
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        swatch.set_size_request(-1, 16)

          box.pack_start(title, False, False, 0)
          box.pack_start(material, False, False, 0)
          box.pack_start(detail, False, False, 0)
          box.pack_start(state, False, False, 0)
          box.pack_end(swatch, False, False, 0)
'''.replace('          ', '        ')
          new = '''        swatch.set_size_request(-1, 24)

          box.pack_start(title, False, False, 0)
          box.pack_start(swatch, False, False, 0)
          box.pack_start(material, False, False, 0)
          box.pack_start(detail, False, False, 0)
          box.pack_end(state, False, False, 0)
'''.replace('          ', '        ')
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    @staticmethod
          def _set_background(widget, color):
              provider = Gtk.CssProvider()
              provider.load_from_data(
                  ("* { background-color: %s; min-height: 14px; }" % color).encode("utf-8")
              )
              widget.get_style_context().add_provider(
                  provider, Gtk.STYLE_PROVIDER_PRIORITY_APPLICATION
              )
              widget._ad5x_css_provider = provider
'''.replace('          ', '    ')
          new = '''    @staticmethod
          def _set_background(widget, color):
              provider = Gtk.CssProvider()
              provider.load_from_data(
                  (
                      "* { background-color: %s; min-height: 20px; "
                      "border: 1px solid rgba(255,255,255,0.55); border-radius: 3px; }"
                      % color
                  ).encode("utf-8")
              )
              widget.get_style_context().add_provider(
                  provider, Gtk.STYLE_PROVIDER_PRIORITY_APPLICATION
              )
              widget._ad5x_css_provider = provider

          def _apply_card_style(self, slot):
              widgets = self._slot_widgets.get(slot)
              if not widgets:
                  return
              data = widgets.get("data") or {}
              active = 0
              if isinstance(self._last_module, dict):
                  active = int(self._last_module.get("active_slot") or 0)
              selected = slot == self._selected_slot
              stall = bool(data.get("stall", False))

              if stall:
                  border = "#ffb020"
              elif slot == active:
                  border = "#39d98a"
              elif selected:
                  border = "#5da9ff"
              else:
                  border = "rgba(255,255,255,0.20)"

              if selected:
                  background = "rgba(255,255,255,0.10)"
              elif slot == active:
                  background = "rgba(57,217,138,0.06)"
              else:
                  background = "rgba(255,255,255,0.025)"

              provider = Gtk.CssProvider()
              provider.load_from_data(
                  (
                      "* { border: 2px solid %s; border-radius: 10px; "
                      "background-color: %s; }" % (border, background)
                  ).encode("utf-8")
              )
              widgets["card"].get_style_context().add_provider(
                  provider, Gtk.STYLE_PROVIDER_PRIORITY_APPLICATION
              )
              widgets["card"]._ad5x_card_css_provider = provider
'''.replace('          ', '    ')
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        self._render_selection()
              self._render_action_buttons()

          def _render_slot(self, slot, data, active):
              widgets = self._slot_widgets[slot]
              widgets["data"] = data if isinstance(data, dict) else {}
              selected = slot == self._selected_slot
              title = f"Слот {slot}"
              if slot == active:
                  title += "  ★"
              if selected:
                  title += "  ▸"
              widgets["title"].set_markup(f"<big><b>{title}</b></big>")
'''.replace('          ', '        ')
          new = '''        self._render_selection()
              self._render_path()
              self._render_action_buttons()

          def _render_slot(self, slot, data, active):
              widgets = self._slot_widgets[slot]
              widgets["data"] = data if isinstance(data, dict) else {}
              if slot == active:
                  widgets["title"].set_markup(
                      f"<big><b>Слот {slot}</b></big>  <small>АКТИВНЫЙ</small>"
                  )
              else:
                  widgets["title"].set_markup(f"<big><b>Слот {slot}</b></big>")
'''.replace('          ', '        ')
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        if not present:
              widgets["material"].set_text("Пустой слот")
              if metadata_status == "stale":
                  widgets["detail"].set_text("Сохранено: " + self._spool_title(data))
              else:
                  widgets["detail"].set_text("Катушка не назначена")
              widgets["state"].set_text("○ Пусто")
              self._render_swatch(widgets["swatch"], data.get("appearance"), False)
              return
'''.replace('          ', '        ')
          new = '''        if not present:
              widgets["material"].set_text("Пустой слот")
              if metadata_status == "stale":
                  widgets["detail"].set_text("Было: " + self._spool_title(data))
              else:
                  widgets["detail"].set_text("Катушка не назначена")
              widgets["state"].set_text("○ Пусто")
              self._render_swatch(widgets["swatch"], data.get("appearance"), False)
              self._apply_card_style(slot)
              return
'''.replace('          ', '        ')
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        if stall:
              state = "⚠ Филамент остановлен"
          elif slot == active:
              state = "● Активный филамент"
          else:
              state = "● Филамент установлен"
          widgets["state"].set_text(state)
          self._render_swatch(widgets["swatch"], data.get("appearance"), True)
'''.replace('          ', '        ')
          new = '''        if stall:
              state = "⚠ ЗАМЯТИЕ"
          elif slot == active:
              state = "● В тракте"
          else:
              state = "● Загружен"
          widgets["state"].set_text(state)
          self._render_swatch(widgets["swatch"], data.get("appearance"), True)
          self._apply_card_style(slot)
'''.replace('          ', '        ')
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    def _render_selection(self):
              for slot, widgets in self._slot_widgets.items():
                  active = 0
                  if isinstance(self._last_module, dict):
                      active = int(self._last_module.get("active_slot") or 0)
                  title = f"Слот {slot}"
                  if slot == active:
                      title += "  ★"
                  if slot == self._selected_slot:
                      title += "  ▸"
                  widgets["title"].set_markup(f"<big><b>{title}</b></big>")

              if not self._selected_slot:
'''.replace('          ', '    ')
          new = '''    def _render_selection(self):
              active = 0
              if isinstance(self._last_module, dict):
                  active = int(self._last_module.get("active_slot") or 0)
              for slot, widgets in self._slot_widgets.items():
                  if slot == active:
                      widgets["title"].set_markup(
                          f"<big><b>Слот {slot}</b></big>  <small>АКТИВНЫЙ</small>"
                      )
                  else:
                      widgets["title"].set_markup(f"<big><b>Слот {slot}</b></big>")
                  self._apply_card_style(slot)

              if not self._selected_slot:
'''.replace('          ', '    ')
          assert old in s
          s = s.replace(old, new, 1)

          marker = '''    def _render_action_buttons(self):
'''
          insert = '''    def _render_path(self):
              module = self._last_module if isinstance(self._last_module, dict) else {}
              active = int(module.get("active_slot") or 0)
              head = module.get("filament_at_toolhead")
              if not active:
                  self.path.set_text("Тракт: —")
                  return
              if head is True:
                  head_text = "● Головка"
              elif head is False:
                  head_text = "○ Головка"
              else:
                  head_text = "? Головка"
              self.path.set_text(f"Тракт: Слот {active}  →  IFS  →  {head_text}")

          def _render_action_buttons(self):
'''.replace('          ', '    ')
          assert marker in s
          s = s.replace(marker, insert, 1)

          old = '''            widgets["state"].set_text("Нет данных")
              self._render_swatch(widgets["swatch"], {}, False)
          self.selection.set_text("Выберите слот")
'''.replace('          ', '            ')
          new = '''            widgets["state"].set_text("Нет данных")
              self._render_swatch(widgets["swatch"], {}, False)
              self._apply_card_style(slot)
          self.path.set_text("Тракт: —")
          self.selection.set_text("Выберите слот")
'''.replace('          ', '            ')
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s)

          t = Path('tools/ad5x-display-spike/klipperscreen/ifs-panel-target-smoke.py')
          q = t.read_text()
          q = q.replace('assert "Активный филамент" in panel._slot_widgets[1]["state"].get_text()',
                        'assert "В тракте" in panel._slot_widgets[1]["state"].get_text()')
          q = q.replace('assert "Сохранено: Previous TPU" == panel._slot_widgets[4]["detail"].get_text()',
                        'assert "Было: Previous TPU" == panel._slot_widgets[4]["detail"].get_text()')
          needle = 'assert not panel._slot_widgets[4]["swatch"].get_visible()\n'
          assert needle in q
          q = q.replace(needle, needle + 'assert panel.path.get_text() == "Тракт: Слот 1  →  IFS  →  ● Головка"\n', 1)
          t.write_text(q)
          PY

          python3 -m py_compile \
            tools/ad5x-display-spike/klipperscreen/ad5x_ifs_panel.py \
            tools/ad5x-display-spike/klipperscreen/ifs-panel-target-smoke.py

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/ad5x-display-spike/klipperscreen/ad5x_ifs_panel.py \
                  tools/ad5x-display-spike/klipperscreen/ifs-panel-target-smoke.py
          git commit -m 'fix(ifs-ui): polish MMU lane presentation after hardware review'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
