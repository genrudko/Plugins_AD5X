name: Z Calibration Core

on:
  push:
    branches:
      - feature/z-calibration-subsystem-v2
    paths:
      - 'moonraker/components/plugins_ad5x.py'
      - 'moonraker/components/plugins_ad5x_zcalibration.py'
      - 'tests/test_plugins_ad5x_component.py'
      - 'tests/test_z_calibration_core.py'
      - '.github/workflows/z-calibration-core.yml'
  pull_request:
    paths:
      - 'moonraker/components/plugins_ad5x.py'
      - 'moonraker/components/plugins_ad5x_zcalibration.py'
      - 'tests/test_plugins_ad5x_component.py'
      - 'tests/test_z_calibration_core.py'
      - '.github/workflows/z-calibration-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-fake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: >-
          python -m py_compile
          moonraker/components/plugins_ad5x.py
          moonraker/components/plugins_ad5x_zcalibration.py
          tests/test_plugins_ad5x_component.py
          tests/test_z_calibration_core.py
      - name: Run repository tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
