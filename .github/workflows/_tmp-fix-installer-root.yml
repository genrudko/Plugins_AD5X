name: Temporary installer root fix

on:
  push:
    branches:
      - ad5x-klipperscreen-spike
    paths:
      - '.github/workflows/_tmp-fix-installer-root.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ad5x-klipperscreen-spike
          fetch-depth: 0
      - name: Patch stable Z-Mod root handling and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          installer = Path('install.sh')
          text = installer.read_text(encoding='utf-8')
          old = '''find_root(){
              for P in /proc/[0-9]*; do
                  [ -r "$P/cmdline" ] || continue
                  CMD="$(tr '\\0' ' ' <"$P/cmdline" 2>/dev/null || true)"
                  case "$CMD" in *moonraker.py*) [ -d "$P/root" ] && { echo "$P/root"; return 0; };; esac
              done
              [ -d /usr/data/.mod/.zmod ] && { echo /usr/data/.mod/.zmod; return 0; }
              return 1
          }
          '''
          new = '''find_root(){
              # AD5X has a stable Z-Mod chroot. Prefer it over /proc/<pid>/root:
              # the latter disappears when the installer intentionally stops Moonraker.
              [ -d /usr/data/.mod/.zmod ] && { echo /usr/data/.mod/.zmod; return 0; }
              for P in /proc/[0-9]*; do
                  [ -r "$P/cmdline" ] || continue
                  CMD="$(tr '\\0' ' ' <"$P/cmdline" 2>/dev/null || true)"
                  case "$CMD" in *moonraker.py*) [ -d "$P/root" ] && { echo "$P/root"; return 0; };; esac
              done
              return 1
          }
          '''
          if old not in text:
              raise SystemExit('expected find_root block not found')
          installer.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_installer_backend_lifecycle.py')
          t = test.read_text(encoding='utf-8')
          anchor = '''    def test_idle_http_unavailable_fails_closed(self) -> None:
          '''
          addition = '''    def test_stable_zmod_root_precedes_process_root_fallback(self) -> None:
                  text = INSTALLER.read_text(encoding="utf-8")
                  start = text.index("find_root(){")
                  end = text.index("remove_lines(){", start)
                  body = text[start:end]
                  self.assertLess(
                      body.index("[ -d /usr/data/.mod/.zmod ]"),
                      body.index("for P in /proc/[0-9]*"),
                  )

          '''
          if 'test_stable_zmod_root_precedes_process_root_fallback' not in t:
              if anchor not in t:
                  raise SystemExit('test insertion anchor not found')
              t = t.replace(anchor, addition + anchor, 1)
              test.write_text(t, encoding='utf-8')
          PY
          sh -n install.sh
          python -m unittest -v tests.test_installer_backend_lifecycle tests.test_installer_ifs_bridge_lifecycle
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'genrudko'
          git config user.email '54811999+genrudko@users.noreply.github.com'
          git rm .github/workflows/_tmp-fix-installer-root.yml
          git add install.sh tests/test_installer_backend_lifecycle.py
          git commit -m 'fix(installer): keep stable Z-Mod root across service stop'
          git push origin HEAD:ad5x-klipperscreen-spike
