name: AD5X KlipperScreen cairo runtime

on:
  workflow_dispatch:
  push:
    branches:
      - ad5x-klipperscreen-spike
    paths:
      - ".github/workflows/ad5x-klipperscreen-cairo-runtime.yml"
      - "tools/ad5x-display-spike/klipperscreen/ad5x_ks_cairo_bridge_defconfig"
      - "tools/ad5x-display-spike/klipperscreen/python-gobject-cairo.patch"
      - "tools/ad5x-display-spike/buildroot/pycairo-1.29.0.patch"

permissions:
  contents: read
  actions: read

concurrency:
  group: ad5x-klipperscreen-cairo-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  HELIXSCREEN_REF: 708e992618d57814055346ae827c0479e7843fc6
  BUILDROOT_REF: 2024.11.2
  TOOLCHAIN_IMAGE: plugins-ad5x/ad5x-toolchain:ks-cairo-ci
  STAGE3_ROOTFS_ARTIFACT_ID: "9254039722"
  STAGE3_ROOTFS_ZIP_SHA256: bb11794acf51b2d622117f149cce00e634759dddb49397e91785bdd7254e8ff7

jobs:
  build-cairo-bridge:
    name: Build MIPS PyGObject cairo bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Checkout Plugins_AD5X
        uses: actions/checkout@v4

      - name: Checkout pinned HelixScreen toolchain source
        uses: actions/checkout@v4
        with:
          repository: prestonbrown/helixscreen
          ref: ${{ env.HELIXSCREEN_REF }}
          path: .ci/helixscreen

      - name: Checkout Buildroot
        uses: actions/checkout@v4
        with:
          repository: buildroot/buildroot
          ref: ${{ env.BUILDROOT_REF }}
          path: .ci/buildroot

      - name: Install host QEMU and artifact tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user unzip

      - name: Build AD5X toolchain image
        run: |
          set -euo pipefail
          docker build \
            -t "$TOOLCHAIN_IMAGE" \
            -f .ci/helixscreen/docker/Dockerfile.ad5x \
            .ci/helixscreen/docker

      - name: Build and package cairo-aware PyGObject
        run: |
          set -euo pipefail
          rm -rf out/ks-cairo
          mkdir -p out/ks-cairo

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            "$TOOLCHAIN_IMAGE" \
            bash -euxo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends cpio unzip rsync bc file python3
              rm -rf /var/lib/apt/lists/*

              unset CROSS_COMPILE CC CXX AR STRIP RANLIB LD TARGET_CFLAGS TARGET_LDFLAGS

              patch -d .ci/buildroot -p1 < tools/ad5x-display-spike/buildroot/pycairo-1.29.0.patch
              patch -d .ci/buildroot -p1 < tools/ad5x-display-spike/klipperscreen/python-gobject-cairo.patch

              DEFCONFIG=/work/tools/ad5x-display-spike/klipperscreen/ad5x_ks_cairo_bridge_defconfig
              make -C .ci/buildroot BR2_DEFCONFIG="$DEFCONFIG" defconfig \
                2>&1 | tee out/ks-cairo/defconfig.log
              cp .ci/buildroot/.config out/ks-cairo/buildroot.config

              for symbol in \
                BR2_TOOLCHAIN_EXTERNAL_FORTRAN \
                BR2_PACKAGE_PYTHON3 \
                BR2_PACKAGE_GOBJECT_INTROSPECTION \
                BR2_PACKAGE_PYTHON_PYCAIRO \
                BR2_PACKAGE_PYTHON_GOBJECT; do
                grep -qx "$symbol=y" .ci/buildroot/.config || exit 1
              done

              grep -q -- "-Dpycairo=enabled" .ci/buildroot/package/python-gobject/python-gobject.mk
              grep -q "python-pycairo" .ci/buildroot/package/python-gobject/python-gobject.mk

              if ! make -C .ci/buildroot -j2 >out/ks-cairo/build.log 2>&1; then
                tail -n 300 out/ks-cairo/build.log
                exit 1
              fi

              TARGET=.ci/buildroot/output/target
              TARGET_GI="$TARGET/usr/lib/python3.12/site-packages/gi"
              BRIDGE="$(find "$TARGET_GI" -maxdepth 1 -type f -name "_gi_cairo*.so" | head -n1)"
              test -n "$BRIDGE"

              BUNDLE_ROOT=out/ks-cairo/bundle-root
              SITE="$BUNDLE_ROOT/opt/ad5x-klipperscreen/lib/python3.12/site-packages"
              mkdir -p "$SITE"
              cp -a "$TARGET_GI" "$SITE/"
              find "$SITE/gi" -type d -name __pycache__ -prune -exec rm -rf {} +

              BUNDLED_BRIDGE="$(find "$SITE/gi" -maxdepth 1 -type f -name "_gi_cairo*.so" | head -n1)"
              test -n "$BUNDLED_BRIDGE"
              mipsel-buildroot-linux-gnu-readelf -h "$BUNDLED_BRIDGE" > out/ks-cairo/gi-cairo.elf.txt
              mipsel-buildroot-linux-gnu-readelf -A "$BUNDLED_BRIDGE" > out/ks-cairo/gi-cairo.attributes.txt
              mipsel-buildroot-linux-gnu-readelf -d "$BUNDLED_BRIDGE" > out/ks-cairo/gi-cairo.dynamic.txt
              grep -Eq "Class:[[:space:]]+ELF32" out/ks-cairo/gi-cairo.elf.txt
              grep -Eq "Data:[[:space:]]+2.s complement, little endian" out/ks-cairo/gi-cairo.elf.txt
              grep -Eq "Flags:.*nan2008.*o32" out/ks-cairo/gi-cairo.elf.txt
              grep -q "Tag_GNU_MIPS_ABI_FP: Hard float (32-bit CPU, 64-bit FPU)" out/ks-cairo/gi-cairo.attributes.txt
              grep -q "ISA: MIPS32r5" out/ks-cairo/gi-cairo.attributes.txt

              {
                echo "stage=4-klipperscreen-cairo-bridge"
                echo "buildroot_ref=2024.11.2"
                echo "helixscreen_ref=708e992618d57814055346ae827c0479e7843fc6"
                echo "python=3.12.9"
                echo "pygobject=3.42.2"
                echo "pycairo=1.29.0"
                echo "bridge=gi._gi_cairo"
              } > "$BUNDLE_ROOT/opt/ad5x-klipperscreen/CAIRO_BRIDGE_BUILDINFO.txt"

              tar --sort=name --mtime="UTC 2020-01-01" \
                --owner=0 --group=0 --numeric-owner \
                -C "$BUNDLE_ROOT" \
                -czf out/ks-cairo/ad5x-klipperscreen-cairo-bridge.tar.gz opt
              sha256sum out/ks-cairo/ad5x-klipperscreen-cairo-bridge.tar.gz | tee out/ks-cairo/SHA256SUMS
              tar -tzf out/ks-cairo/ad5x-klipperscreen-cairo-bridge.tar.gz | sort > out/ks-cairo/bundle-files.txt
            '

      - name: Download accepted Stage 3 rootfs evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out/stage3
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${STAGE3_ROOTFS_ARTIFACT_ID}/zip" \
            -o out/stage3/rootfs-artifact.zip
          echo "${STAGE3_ROOTFS_ZIP_SHA256}  out/stage3/rootfs-artifact.zip" | sha256sum -c -
          unzip -q out/stage3/rootfs-artifact.zip -d out/stage3/artifact
          mkdir -p out/stage3/rootfs
          gzip -dc out/stage3/artifact/ad5x-gtk-rootfs.tar.gz | tar -xf - -C out/stage3/rootfs

      - name: QEMU prove cairo foreign conversion against Stage 3
        run: |
          set -euo pipefail
          TARGET="$PWD/out/stage3/rootfs"
          SITE="$PWD/out/ks-cairo/bundle-root/opt/ad5x-klipperscreen/lib/python3.12/site-packages"
          env \
            QEMU_LD_PREFIX="$TARGET" \
            PYTHONHOME="$TARGET/usr" \
            PYTHONPATH="$SITE:$TARGET/usr/lib/python3.12/site-packages" \
            LD_LIBRARY_PATH="$TARGET/usr/lib:$TARGET/lib" \
            GI_TYPELIB_PATH="$TARGET/usr/lib/girepository-1.0" \
            qemu-mipsel "$TARGET/usr/bin/python3" -c \
              'import cairo,gi; gi.require_foreign("cairo"); gi.require_version("Gdk","3.0"); from gi.repository import Gdk; s=cairo.ImageSurface(cairo.FORMAT_ARGB32,2,2); c=cairo.Context(s); rgba=Gdk.RGBA(); assert rgba.parse("#123456"); Gdk.cairo_set_source_rgba(c,rgba); c.paint(); print("QEMU_CAIRO_FOREIGN_OK", cairo.version, gi.__version__)' \
            | tee out/ks-cairo/qemu-cairo-foreign.txt
          grep -q '^QEMU_CAIRO_FOREIGN_OK 1.29.0 3.42.2' out/ks-cairo/qemu-cairo-foreign.txt

      - name: Validate isolated cairo bridge archive
        run: |
          set -euo pipefail
          test -s out/ks-cairo/ad5x-klipperscreen-cairo-bridge.tar.gz
          grep -q '^opt/ad5x-klipperscreen/lib/python3.12/site-packages/gi/_gi_cairo' out/ks-cairo/bundle-files.txt
          if grep -Eq '^(usr|lib|bin)/|^opt/ad5x-x11/' out/ks-cairo/bundle-files.txt; then
            exit 1
          fi
          for forbidden in libc.so.6 ld-linux-mipsn8.so.1 libpython3.so libpython3.12.so libatomic.so.1; do
            if grep -F "/$forbidden" out/ks-cairo/bundle-files.txt; then
              exit 1
            fi
          done
          echo "KS_CAIRO_BRIDGE_DELTA_OK"

      - name: Upload cairo bridge runtime delta
        uses: actions/upload-artifact@v4
        with:
          name: ad5x-klipperscreen-cairo-bridge-${{ github.sha }}
          path: |
            out/ks-cairo/ad5x-klipperscreen-cairo-bridge.tar.gz
            out/ks-cairo/SHA256SUMS
            out/ks-cairo/bundle-files.txt
            out/ks-cairo/qemu-cairo-foreign.txt
          retention-days: 14
          if-no-files-found: error

      - name: Upload cairo bridge diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ad5x-klipperscreen-cairo-bridge-diagnostics-${{ github.sha }}
          path: |
            out/ks-cairo/build.log
            out/ks-cairo/buildroot.config
            out/ks-cairo/defconfig.log
            out/ks-cairo/gi-cairo.elf.txt
            out/ks-cairo/gi-cairo.attributes.txt
            out/ks-cairo/gi-cairo.dynamic.txt
            out/ks-cairo/qemu-cairo-foreign.txt
          retention-days: 7
          if-no-files-found: warn
