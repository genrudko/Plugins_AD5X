name: AD5X IFS launch contract apply

on:
  push:
    branches:
      - feature/ifs-manager-v1
    paths:
      - '.github/workflows/ad5x-ifs-launch-contract-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ifs-manager-v1
      - name: Apply and test launch gate model
        run: |
          set -euo pipefail
          python3 tools/ad5x-display-spike/klipperscreen/tmp_launch_contract_patch.py
          python3 -m py_compile moonraker/components/plugins_ad5x_ifs_model.py
          git diff --check
          python3 -m unittest -v \
            tests.test_plugins_ad5x_ifs_launch_contract \
            tests.test_plugins_ad5x_ifs_preprint_plan \
            tests.test_plugins_ad5x_ifs_projection \
            tests.test_plugins_ad5x_ifs_model \
            tests.test_plugins_ad5x_ifs_manager_contract \
            tests.test_plugins_ad5x_ifs_backend \
            tests.test_plugins_ad5x_ifs_job_preview
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add moonraker/components/plugins_ad5x_ifs_model.py
          git commit -m 'feat(ifs): model fail-closed Z-Mod job launch gate'
          git push origin HEAD:feature/ifs-manager-v1
