name: AD5X WebScreen C cross-build

on:
  push:
    branches:
      - research/ad5x-webscreen-c-build-017
    paths:
      - '.github/workflows/ad5x-webscreen-c-build.yml'
      - 'ci/ws017.patch'
      - 'ci/ws-src.b64.part*'

permissions:
  contents: read

jobs:
  build-mips:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble 0.1.5 base and apply 0.1.8 patch
        run: |
          set -euxo pipefail
          cat ci/ws-src.b64.part* | base64 -d > /tmp/webscreen-src.tar.gz
          echo '957861c1d3c00ca39d6ceaf9ca66074af14c79ce37c823e7de52c5344fed940a  /tmp/webscreen-src.tar.gz' | sha256sum -c -
          mkdir -p /tmp/webscreen-src
          tar -xzf /tmp/webscreen-src.tar.gz -C /tmp/webscreen-src
          cd /tmp/webscreen-src/ad5x_webscreen_plugin
          test "$(cat VERSION)" = '0.1.5'
          patch -p1 < "$GITHUB_WORKSPACE/ci/ws017.patch"
          test "$(cat VERSION)" = '0.1.8'
          /bin/sh tests/test_packaging.sh
          /bin/sh tests/test_runtime_readonly.sh
          cc -std=c11 -Wall -Wextra -Werror -O2 -Isrc tests/test_framebuffer.c src/framebuffer.c -o /tmp/test_framebuffer
          /tmp/test_framebuffer

      - name: Download Ingenic XBurst2 glibc 2.29 toolchain
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 2 \
            -o /tmp/mips-toolchain.tar.gz \
            https://github.com/ballaswag/k1-discovery/releases/download/1.0.0/mips-gcc720-glibc229.tar.gz
          mkdir -p /tmp/mips-toolchain
          tar -xzf /tmp/mips-toolchain.tar.gz -C /tmp/mips-toolchain
          CC_PATH="$(find /tmp/mips-toolchain -type f -name mips-linux-gnu-gcc -perm -111 | head -n1)"
          test -n "$CC_PATH"
          TOOLBIN="$(dirname "$CC_PATH")"
          echo "$TOOLBIN" >> "$GITHUB_PATH"
          "$CC_PATH" --version

      - name: Build static libjpeg-turbo for target
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 2 \
            -o /tmp/libjpeg-turbo.tar.gz \
            https://github.com/libjpeg-turbo/libjpeg-turbo/archive/refs/tags/3.0.4.tar.gz
          tar -xzf /tmp/libjpeg-turbo.tar.gz -C /tmp
          TARGET_FLAGS='-O3 -march=mips32r5 -mabi=32 -mhard-float -mfp64 -mnan=2008 -EL'
          cmake -S /tmp/libjpeg-turbo-3.0.4 -B /tmp/libjpeg-build \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=mipsel \
            -DCMAKE_C_COMPILER=mips-linux-gnu-gcc \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_C_FLAGS="$TARGET_FLAGS" \
            -DENABLE_SHARED=OFF \
            -DENABLE_STATIC=ON \
            -DWITH_SIMD=OFF \
            -DWITH_JAVA=OFF \
            -DWITH_TURBOJPEG=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/libjpeg-target
          cmake --build /tmp/libjpeg-build --parallel 2
          cmake --install /tmp/libjpeg-build
          grep -q '^#define JCS_EXTENSIONS' /tmp/libjpeg-target/include/jpeglib.h

      - name: Cross-build AD5X daemon
        run: |
          set -euxo pipefail
          cd /tmp/webscreen-src/ad5x_webscreen_plugin
          mkdir -p bin
          JPEG_A="$(find /tmp/libjpeg-target -type f -name libjpeg.a | head -n1)"
          test -n "$JPEG_A"
          TARGET_FLAGS='-O3 -std=c11 -Wall -Wextra -Werror -pthread -march=mips32r5 -mabi=32 -mhard-float -mfp64 -mnan=2008 -EL -Isrc -I/tmp/libjpeg-target/include'
          mips-linux-gnu-gcc $TARGET_FLAGS \
            src/ad5x_webscreen.c src/webscreen_core.c src/framebuffer.c src/jpeg_encoder.c src/touch.c \
            "$JPEG_A" -pthread -o bin/ad5x_webscreen_plugin
          chmod 755 bin/ad5x_webscreen_plugin *.sh tests/*.sh tests/*.py
          mips-linux-gnu-strip bin/ad5x_webscreen_plugin

      - name: Verify target ABI and fast path
        run: |
          set -euxo pipefail
          BIN=/tmp/webscreen-src/ad5x_webscreen_plugin/bin/ad5x_webscreen_plugin
          FLAGS="$(mips-linux-gnu-readelf -h "$BIN" | grep 'Flags:')"
          ATTRS="$(mips-linux-gnu-readelf -A "$BIN")"
          echo "$FLAGS" | grep -q 'nan2008'
          echo "$FLAGS" | grep -q 'o32'
          echo "$ATTRS" | grep -q 'Hard float (32-bit CPU, 64-bit FPU)'
          mips-linux-gnu-readelf -l "$BIN" | grep -q '/lib/ld-linux-mipsn8.so.1'
          if mips-linux-gnu-readelf -d "$BIN" | grep -q 'Shared library: \[libjpeg'; then
            echo 'ERROR: libjpeg must be static in the PoC package'
            exit 1
          fi
          grep -q 'JCS_EXT_BGRA' /tmp/webscreen-src/ad5x_webscreen_plugin/src/jpeg_encoder.c
          grep -q 'ad5x_framebuffer_visible_ptr' /tmp/webscreen-src/ad5x_webscreen_plugin/src/ad5x_webscreen.c
          strings "$BIN" | grep -q 'jpeg_direct_bgra'

      - name: Package
        run: |
          set -euxo pipefail
          cd /tmp/webscreen-src
          printf '%s\n' \
            'AD5X WebScreen C PoC 0.1.8.' \
            'Direct mmap framebuffer path + libjpeg-turbo JCS_EXT_BGRA for landscape AD5X.' \
            'Fallback capture path lazy allocation verified by regression test.' \
            'Target: ELF32 MIPSel, o32, nan2008, hard-float FP64, MIPS32r5.' \
            > ad5x_webscreen_plugin/BUILD_INFO.txt
          tar -czf "$GITHUB_WORKSPACE/AD5X_WebScreen_C_PoC_0.1.8_MIPS.tar.gz" ad5x_webscreen_plugin
          zip -qr "$GITHUB_WORKSPACE/AD5X_WebScreen_C_PoC_0.1.8_MIPS.zip" ad5x_webscreen_plugin
          sha256sum "$GITHUB_WORKSPACE"/AD5X_WebScreen_C_PoC_0.1.8_MIPS.*

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ad5x-webscreen-c-mips-0.1.8
          path: |
            AD5X_WebScreen_C_PoC_0.1.8_MIPS.zip
            AD5X_WebScreen_C_PoC_0.1.8_MIPS.tar.gz
          if-no-files-found: error
          retention-days: 7
