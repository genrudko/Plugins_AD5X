name: AD5X IFS preprint plan apply

on:
  push:
    branches:
      - feature/ifs-manager-v1
    paths:
      - '.github/workflows/ad5x-ifs-preprint-plan-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ifs-manager-v1
      - name: Apply and test preprint plan model
        run: |
          set -euo pipefail
          PAYLOAD=''
          python3 -c 'import base64,zlib; exec(zlib.decompress(base64.b64decode("'"'"'$PAYLOAD'"'"'")).decode())'
          python3 -m py_compile moonraker/components/plugins_ad5x_ifs_model.py
          git diff --check
          python3 -m unittest -v \
            tests.test_plugins_ad5x_ifs_preprint_plan \
            tests.test_plugins_ad5x_ifs_projection \
            tests.test_plugins_ad5x_ifs_model \
            tests.test_plugins_ad5x_ifs_manager_contract \
            tests.test_plugins_ad5x_ifs_backend \
            tests.test_plugins_ad5x_ifs_metadata_store \
            tests.test_plugins_ad5x_ifs_job_preview
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add moonraker/components/plugins_ad5x_ifs_model.py
          git commit -m 'feat(ifs): normalize frontend-neutral preprint plan'
          git push origin HEAD:feature/ifs-manager-v1
