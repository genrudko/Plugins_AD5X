name: AD5X IFS UI finalize

on:
  push:
    branches:
      - feature/ifs-manager-v1
    paths:
      - '.github/workflows/ad5x-ifs-ui-finalize.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch exact-branch final gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for WORKFLOW in ad5x-ifs-ui-target-smoke.yml ad5x-klipperscreen-spike.yml; do
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}/dispatches" \
              -d '{"ref":"feature/ifs-manager-v1"}'
            echo "DISPATCH_OK ${WORKFLOW}"
          done
