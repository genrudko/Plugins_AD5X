name: AD5X IFS UI polish run

on:
  push:
    branches:
      - feature/ifs-manager-v1
    paths:
      - '.github/workflows/ad5x-ifs-ui-polish-run.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ifs-manager-v1
      - name: Apply final card polish
        run: |
          set -euo pipefail
          python3 .github/tmp/patch_ifs_ui_polish2.py
          python3 -m py_compile tools/ad5x-display-spike/klipperscreen/ad5x_ifs_panel.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/ad5x-display-spike/klipperscreen/ad5x_ifs_panel.py
          git commit -m 'fix(ifs-ui): tighten active and selected card states'
          git push origin HEAD:feature/ifs-manager-v1
