name: AD5X IFS job preview patch

on:
  push:
    branches:
      - feature/ifs-manager-v1
    paths:
      - '.github/workflows/ad5x-ifs-job-preview-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ifs-manager-v1
      - name: Patch backend and contracts
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          python3 -m py_compile klipper/extras/ad5x_ifs.py moonraker/components/plugins_ad5x.py moonraker/components/plugins_ad5x_ifs_model.py tests/test_plugins_ad5x_ifs_job_preview.py
          git diff --check
          python3 -m unittest -v tests.test_ad5x_ifs_bridge tests.test_plugins_ad5x_component tests.test_plugins_ad5x_ifs_backend tests.test_plugins_ad5x_ifs_job_preview tests.test_plugins_ad5x_ifs_model tests.test_plugins_ad5x_ifs_manager_contract
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION moonraker/components/plugins_ad5x.py moonraker/components/plugins_ad5x_ifs_model.py tests/test_plugins_ad5x_component.py tests/test_plugins_ad5x_ifs_model.py tests/test_plugins_ad5x_ifs_manager_contract.py .github/workflows/ad5x-ifs-bridge-preflight.yml
          git commit -m 'feat(ifs): expose Z-Mod delegated job preview API'
          git push origin HEAD:feature/ifs-manager-v1
