name: AD5X IFS Stage 4 dispatch

on:
  pull_request:
    branches:
      - ad5x-klipperscreen-spike
    paths:
      - '.github/workflows/ad5x-ifs-stage4-dispatch.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch full Stage 4 workflow on exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test -n "$HEAD_REF"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ad5x-klipperscreen-spike.yml/dispatches" \
            -d "{\"ref\":\"${HEAD_REF}\"}"
          echo "STAGE4_DISPATCH_OK ref=${HEAD_REF}"
