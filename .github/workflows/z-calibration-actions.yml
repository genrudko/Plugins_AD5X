name: Z Calibration Actions

on:
  push:
    branches:
      - feature/z-calibration-subsystem-v2
    paths:
      - 'moonraker/components/plugins_ad5x_zactions.py'
      - 'moonraker/components/plugins_ad5x_zpolicy.py'
      - 'moonraker/components/plugins_ad5x_zorchestrator.py'
      - 'tests/test_z_calibration_actions.py'
      - 'tests/test_z_calibration_policy_gate.py'
      - 'tests/test_z_calibration_orchestrator.py'
      - 'tests/test_z_calibration_orchestrator_atomicity.py'
      - '.github/workflows/z-calibration-actions.yml'
  pull_request:
    paths:
      - 'moonraker/components/plugins_ad5x_zactions.py'
      - 'moonraker/components/plugins_ad5x_zpolicy.py'
      - 'moonraker/components/plugins_ad5x_zorchestrator.py'
      - 'tests/test_z_calibration_actions.py'
      - 'tests/test_z_calibration_policy_gate.py'
      - 'tests/test_z_calibration_orchestrator.py'
      - 'tests/test_z_calibration_orchestrator_atomicity.py'
      - '.github/workflows/z-calibration-actions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile calibration layers
        run: >-
          python -m py_compile
          moonraker/components/plugins_ad5x_zcalibration.py
          moonraker/components/plugins_ad5x_zorchestrator.py
          moonraker/components/plugins_ad5x_zpolicy.py
          moonraker/components/plugins_ad5x_zactions.py
          tests/test_z_calibration_orchestrator.py
          tests/test_z_calibration_orchestrator_atomicity.py
          tests/test_z_calibration_policy_gate.py
          tests/test_z_calibration_actions.py
      - name: Run complete repository suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
