# Plugins AD5X owner RC v1 — pure Klipper saved+check policy guard.
#
# This file intentionally defines no _USER_START_PRINT owner. Live integration
# must chain it after the existing hook owner (currently Calibration Center's
# CC_APPLY_PROFILE) instead of creating a duplicate Klipper section.
#
# RC delegates physical contact/temporary Z adjustment to Z-Mod MESH_TEST=3.
# Saved and freshly-built meshes must both finish with native AutoZOffset reconciliation.
#
# Public ADZ_* actions below are semantic wrappers only. ADZ is the
# parser-safe Plugins AD5X Z-calibration G-Code namespace: Klipper requires
# digits in macro command names to appear only at the end. These wrappers do
# not contain PROBE/G0/G1/direct SET_GCODE_OFFSET commands. Physical
# motion/contact remains implemented by Z-Mod macros.

[gcode_macro _ADZ_RC_ABORT_MODE]
gcode:
    {% set mode = params.MODE|default(-1)|int %}
    {action_raise_error("Plugins AD5X Z RC: MESH_TEST=%d rejected; unattended saved+check requires MESH_TEST=3 or disabled mode 0" % mode)}

[gcode_macro _ADZ_RC_ABORT_PATH]
gcode:
    {action_raise_error("Plugins AD5X Z RC: job requested a calibration path whose final mesh provenance is not yet accepted by Plugins AD5X.")}

[gcode_macro _ADZ_RC_ABORT_PROFILE]
gcode:
    {% set profile = params.PROFILE|default("none")|string %}
    {action_raise_error("Plugins AD5X Z RC: active mesh '%s' is not accepted profile 'auto'." % profile)}


[gcode_macro _ADZ_RC_ABORT_ALIGNMENT]
gcode:
    {% set delta = params.DELTA|default(0.0)|float %}
    {% set limit = params.LIMIT|default(0.0)|float %}
    {action_raise_error("Plugins AD5X Z RC: Auto-Z %.4f mm exceeds accepted %.4f mm envelope; hardware change suspected." % (delta, limit))}

[gcode_macro _ADZ_PREPRINT_DISABLED]
gcode:
    SET_GCODE_VARIABLE MACRO=_TEST_POINT VARIABLE=temp_z_offset VALUE=0.0
    LOAD_GCODE_OFFSET
    RESPOND PREFIX="info" MSG="Plugins AD5X: автоматическая Z-калибровка перед печатью выключена; Auto-Z сброшен, сохранённая пользовательская коррекция применена"

[gcode_macro _ADZ_VALIDATE_NATIVE_RESULT]
gcode:
    {% set policy = printer["gcode_macro _ADZ_SAVED_CHECK_POLICY"] %}
    {% set auto_alignment = printer["gcode_macro _TEST_POINT"].temp_z_offset|default(0.0)|float %}
    {% set active_profile = printer.bed_mesh.profile_name|default("")|string %}
    {% set limit = policy.max_auto_alignment|float %}
    {% if auto_alignment|abs >= limit %}
        LOAD_GCODE_OFFSET
        _ADZ_RC_ABORT_ALIGNMENT DELTA={auto_alignment} LIMIT={limit}
    {% else %}
        RESPOND PREFIX="info" MSG="Plugins AD5X native Auto-Z PASS: mesh={active_profile} Auto-Z={auto_alignment|round(4)} mm"
    {% endif %}

[gcode_macro _ADZ_RC_ABORT_PRIME]
gcode:
    {% set delegate = params.DELEGATE|default("none")|string %}
    {action_raise_error("Plugins AD5X Z RC: unsafe/missing priming delegate '%s'; refusing to bypass pre-prime Z finalization." % delegate)}

[gcode_macro _ADZ_PRIME_GATE]
variable_fresh_finalized: 0
gcode:
    {% set v = printer.save_variables.variables %}
    {% set delegate = v['adz_prime_delegate']|default("")|string %}
    {% if delegate == "" or delegate == "_ADZ_PRIME_GATE" %}
        _ADZ_RC_ABORT_PRIME DELEGATE="{delegate}"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_ADZ_PRIME_GATE VARIABLE=fresh_finalized VALUE=0
        _ADZ_SAVED_CHECK_POLICY PRE_PRIME=1
        {delegate}
    {% endif %}

[gcode_macro _ADZ_PREPRINT_FRESH_MESH]
gcode:
    {% set profile = printer.bed_mesh.profile_name|default("")|string %}
    RESPOND PREFIX="info" MSG="Plugins AD5X: fresh mesh '{profile}' ready; running final native Z-Mod AutoZOffset"
    LOAD_GCODE_OFFSET
    _MESH_TEST
    _ADZ_VALIDATE_NATIVE_RESULT

[gcode_macro _ADZ_SAVED_CHECK_POLICY]
variable_policy_id: "zcal-saved-check-v1-20260817"
variable_max_auto_alignment: 0.120000
variable_saved_profile: "auto"
gcode:
    {% set v = printer.save_variables.variables %}
    {% set screen = printer["gcode_macro _SCREEN"].screen %}
    {% set load_zoffset = v['load_zoffset']|default(1)|int %}
    {% set mesh_test = v['mesh_test']|default(1)|int %}
    {% set print_leveling = v['print_leveling']|default(0)|int %}
    {% set force_kamp = printer["gcode_macro _START_PRINT"].zforce_kamp|default(False) %}
    {% set force_leveling = printer["gcode_macro _START_PRINT"].zforce_leveling|default(False) %}
    {% set auto_alignment = printer["gcode_macro _TEST_POINT"].temp_z_offset|default(0.0)|float %}
    {% set active_profile = printer.bed_mesh.profile_name|default("")|string %}
    {% set pre_prime = params.PRE_PRIME|default(0)|int %}
    {% set fresh_finalized = printer["gcode_macro _ADZ_PRIME_GATE"].fresh_finalized|default(0)|int %}
    {% set fresh_mesh_proven = force_kamp == True or force_leveling == True or (print_leveling != 0 and screen == False) %}
    {% set native_leveling_ambiguous = print_leveling != 0 and screen != False %}

    {% if mesh_test == 0 %}
        _ADZ_PREPRINT_DISABLED
    {% elif mesh_test != 3 %}
        LOAD_GCODE_OFFSET
        _ADZ_RC_ABORT_MODE MODE={mesh_test}
    {% elif native_leveling_ambiguous %}
        LOAD_GCODE_OFFSET
        _ADZ_RC_ABORT_PATH
    {% elif screen != False or load_zoffset != 1 %}
        LOAD_GCODE_OFFSET
        _ADZ_RC_ABORT_PATH
    {% elif fresh_mesh_proven and pre_prime == 1 %}
        _ADZ_PREPRINT_FRESH_MESH
        SET_GCODE_VARIABLE MACRO=_ADZ_PRIME_GATE VARIABLE=fresh_finalized VALUE=1
    {% elif fresh_mesh_proven and fresh_finalized == 1 %}
        _ADZ_VALIDATE_NATIVE_RESULT
    {% elif fresh_mesh_proven %}
        LOAD_GCODE_OFFSET
        _ADZ_RC_ABORT_PATH
    {% elif print_leveling != 0 or force_kamp == True or force_leveling == True %}
        LOAD_GCODE_OFFSET
        _ADZ_RC_ABORT_PATH
    {% elif active_profile != saved_profile %}
        LOAD_GCODE_OFFSET
        _ADZ_RC_ABORT_PROFILE PROFILE="{active_profile}"
    {% elif auto_alignment|abs >= max_auto_alignment %}
        LOAD_GCODE_OFFSET
        _ADZ_RC_ABORT_ALIGNMENT DELTA={auto_alignment} LIMIT={max_auto_alignment}
    {% else %}
        RESPOND PREFIX="info" MSG="Plugins AD5X saved+check PASS: policy={policy_id} mesh={active_profile} Auto-Z={auto_alignment|round(4)} mm"
    {% endif %}

[gcode_macro _ADZ_ACTION_CONTRACT]
variable_contract_version: 3
variable_runtime_profile: "ad5x_runtime"
variable_preprint_enabled_mode: 3
variable_preprint_disabled_mode: 0
gcode:

[gcode_macro _ADZ_ACTION_ABORT_BUSY]
gcode:
    {% set state = params.STATE|default("unknown")|string %}
    {action_raise_error("Plugins AD5X Z action rejected: printer state '%s' is not idle." % state)}

[gcode_macro _ADZ_ACTION_ABORT_TEMP]
gcode:
    {% set nozzle = params.NOZZLE|default(-1)|float %}
    {% set bed = params.BED|default(-1)|float %}
    {action_raise_error("Plugins AD5X Z action rejected: explicit calibration temperatures are invalid (nozzle %.1f C, bed %.1f C)." % (nozzle, bed))}

[gcode_macro _ADZ_ACTION_ABORT_BOOLEAN]
gcode:
    {% set value = params.VALUE|default(-1)|int %}
    {action_raise_error("Plugins AD5X Z action rejected: ENABLED must be 0 or 1, got %d." % value)}

[gcode_macro ADZ_SET_PREPRINT]
description: Persistently enable or disable automatic Plugins AD5X pre-print Z calibration
gcode:
    {% set state = printer.print_stats.state|default("unknown")|string %}
    {% set enabled = params.ENABLED|default(-1)|int %}
    {% set contract = printer["gcode_macro _ADZ_ACTION_CONTRACT"] %}

    {% if state == "printing" or state == "paused" %}
        _ADZ_ACTION_ABORT_BUSY STATE="{state}"
    {% elif enabled == 1 %}
        SAVE_VARIABLE VARIABLE=mesh_test VALUE={contract.preprint_enabled_mode|int}
        RESPOND PREFIX="info" MSG="Plugins AD5X: автоматическая Z-калибровка перед печатью включена (MESH_TEST=3)"
    {% elif enabled == 0 %}
        SAVE_VARIABLE VARIABLE=mesh_test VALUE={contract.preprint_disabled_mode|int}
        SET_GCODE_VARIABLE MACRO=_TEST_POINT VARIABLE=temp_z_offset VALUE=0.0
        LOAD_GCODE_OFFSET
        RESPOND PREFIX="info" MSG="Plugins AD5X: автоматическая Z-калибровка перед печатью выключена (MESH_TEST=0)"
    {% else %}
        _ADZ_ACTION_ABORT_BOOLEAN VALUE={enabled}
    {% endif %}

[gcode_macro ADZ_CHECK]
description: Plugins AD5X semantic saved-mesh Z check delegated to Z-Mod
gcode:
    {% set state = printer.print_stats.state|default("unknown")|string %}
    {% set extruder_temp = params.EXTRUDER_TEMP|default(-1)|float %}
    {% set bed_temp = params.BED_TEMP|default(-1)|float %}
    {% set extruder_min = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}
    {% set extruder_max = printer.configfile.settings.extruder.max_temp|default(300)|float - 5.0 %}
    {% set bed_max = printer.configfile.settings.heater_bed.max_temp|default(120)|float - 5.0 %}
    {% set old_extruder_temp = printer["gcode_macro _START_PRINT"].zextruder_temp|float %}
    {% set old_bed_temp = printer["gcode_macro _START_PRINT"].zbed_temp|float %}
    {% set mesh_test = printer.save_variables.variables['mesh_test']|default(1)|int %}

    {% if state == "printing" or state == "paused" %}
        _ADZ_ACTION_ABORT_BUSY STATE="{state}"
    {% elif mesh_test != 3 %}
        _ADZ_RC_ABORT_MODE MODE={mesh_test}
    {% elif extruder_temp < extruder_min or extruder_temp > extruder_max or bed_temp < 30.0 or bed_temp > bed_max %}
        _ADZ_ACTION_ABORT_TEMP NOZZLE={extruder_temp} BED={bed_temp}
    {% else %}
        LOAD_GCODE_OFFSET
        _ADZ_SAVED_CHECK_POLICY

        SET_GCODE_VARIABLE MACRO=_START_PRINT VARIABLE=zextruder_temp VALUE={extruder_temp}
        SET_GCODE_VARIABLE MACRO=_START_PRINT VARIABLE=zbed_temp VALUE={bed_temp}

        RESPOND PREFIX="info" MSG="Plugins AD5X: Проверить Z; Z-Mod _MESH_TEST; nozzle={extruder_temp}; bed={bed_temp}"
        _MESH_TEST

        _ADZ_SAVED_CHECK_POLICY

        SET_GCODE_VARIABLE MACRO=_START_PRINT VARIABLE=zextruder_temp VALUE={old_extruder_temp}
        SET_GCODE_VARIABLE MACRO=_START_PRINT VARIABLE=zbed_temp VALUE={old_bed_temp}
        RESPOND PREFIX="info" MSG="Plugins AD5X: Проверить Z завершено"
    {% endif %}

[gcode_macro ADZ_BUILD_RUNTIME_MESH]
description: Plugins AD5X semantic temporary full mesh delegated to Z-Mod
gcode:
    {% set state = printer.print_stats.state|default("unknown")|string %}
    {% set extruder_temp = params.EXTRUDER_TEMP|default(-1)|float %}
    {% set bed_temp = params.BED_TEMP|default(-1)|float %}
    {% set extruder_min = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}
    {% set extruder_max = printer.configfile.settings.extruder.max_temp|default(300)|float - 5.0 %}
    {% set bed_max = printer.configfile.settings.heater_bed.max_temp|default(120)|float - 5.0 %}
    {% set runtime_profile = printer["gcode_macro _ADZ_ACTION_CONTRACT"].runtime_profile|string %}

    {% if state == "printing" or state == "paused" %}
        _ADZ_ACTION_ABORT_BUSY STATE="{state}"
    {% elif extruder_temp < extruder_min or extruder_temp > extruder_max or bed_temp < 30.0 or bed_temp > bed_max %}
        _ADZ_ACTION_ABORT_TEMP NOZZLE={extruder_temp} BED={bed_temp}
    {% else %}
        LOAD_GCODE_OFFSET
        _ADZ_SAVED_CHECK_POLICY

        RESPOND PREFIX="info" MSG="Plugins AD5X: временная карта {runtime_profile}; nozzle={extruder_temp}; bed={bed_temp}"
        AUTO_FULL_BED_LEVEL EXTRUDER_TEMP={extruder_temp} BED_TEMP={bed_temp} PROFILE={runtime_profile}

        BED_MESH_PROFILE LOAD=auto FROM=ADZ_BUILD_RUNTIME_MESH
        LOAD_GCODE_OFFSET
        _ADZ_SAVED_CHECK_POLICY
        RESPOND PREFIX="info" MSG="Plugins AD5X: временная карта {runtime_profile} готова; active mesh restored to auto"
    {% endif %}

[gcode_macro ADZ_RESTORE_AUTO]
description: Restore accepted saved auto mesh after a failed/aborted runtime action
gcode:
    {% set state = printer.print_stats.state|default("unknown")|string %}
    {% if state == "printing" or state == "paused" %}
        _ADZ_ACTION_ABORT_BUSY STATE="{state}"
    {% else %}
        BED_MESH_PROFILE LOAD=auto FROM=ADZ_RESTORE_AUTO
        LOAD_GCODE_OFFSET
        _ADZ_SAVED_CHECK_POLICY
        RESPOND PREFIX="info" MSG="Plugins AD5X: saved auto mesh restored"
    {% endif %}

# Legacy observer compatibility object. It is deliberately never invoked as
# G-Code: names with an embedded digit are not parser-safe in Klipper. Keep it
# only so the already-deployed observer/runtime verifier can read the unchanged
# policy identity during the namespace migration. It may be removed after all
# consumers have moved to _ADZ_SAVED_CHECK_POLICY.
[gcode_macro _AD5X_Z_SAVED_CHECK_POLICY]
variable_policy_id: "zcal-saved-check-v1-20260817"
variable_max_auto_alignment: 0.120000
variable_saved_profile: "auto"
variable_saved_reference: -1.925833
variable_reference_tolerance: 0.000500
gcode:
