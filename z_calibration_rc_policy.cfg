# Plugins AD5X owner RC v1 — pure Klipper saved+check policy guard.
#
# This file intentionally defines no _USER_START_PRINT owner. Live integration
# must chain it after the existing hook owner (currently Calibration Center's
# CC_APPLY_PROFILE) instead of creating a duplicate Klipper section.
#
# RC v1 delegates physical contact/temporary Z adjustment to Z-Mod MESH_TEST=3
# and only validates the resulting state before printing continues.

[gcode_macro _AD5X_Z_RC_ABORT_MODE]
gcode:
    {% set mode = params.MODE|default(-1)|int %}
    {action_raise_error("Plugins AD5X Z RC: MESH_TEST=%d rejected; unattended saved+check requires MESH_TEST=3" % mode)}

[gcode_macro _AD5X_Z_RC_ABORT_PATH]
gcode:
    {action_raise_error("Plugins AD5X Z RC: job requested a calibration path outside accepted saved+check (KAMP/full leveling/screen/non-global Z).")}

[gcode_macro _AD5X_Z_RC_ABORT_PROFILE]
gcode:
    {% set profile = params.PROFILE|default("none")|string %}
    {action_raise_error("Plugins AD5X Z RC: active mesh '%s' is not accepted profile 'auto'." % profile)}

[gcode_macro _AD5X_Z_RC_ABORT_REFERENCE]
gcode:
    {% set current = params.CURRENT|default(999.0)|float %}
    {% set expected = params.EXPECTED|default(0.0)|float %}
    {action_raise_error("Plugins AD5X Z RC: saved auto reference changed (current %.6f, accepted %.6f); full calibration/review required." % (current, expected))}

[gcode_macro _AD5X_Z_RC_ABORT_ALIGNMENT]
gcode:
    {% set delta = params.DELTA|default(0.0)|float %}
    {% set limit = params.LIMIT|default(0.0)|float %}
    {action_raise_error("Plugins AD5X Z RC: Auto-Z %.4f mm exceeds accepted %.4f mm envelope; hardware change suspected." % (delta, limit))}

[gcode_macro _AD5X_Z_SAVED_CHECK_POLICY]
variable_policy_id: "zcal-saved-check-v1-20260817"
variable_max_auto_alignment: 0.120000
variable_saved_profile: "auto"
variable_saved_reference: -1.925833
variable_reference_tolerance: 0.000500
gcode:
    {% set v = printer.save_variables.variables %}
    {% set screen = printer["gcode_macro _SCREEN"].screen %}
    {% set load_zoffset = v['load_zoffset']|default(1)|int %}
    {% set mesh_test = v['mesh_test']|default(1)|int %}
    {% set print_leveling = v['print_leveling']|default(0)|int %}
    {% set force_kamp = printer["gcode_macro _START_PRINT"].zforce_kamp|default(False) %}
    {% set force_leveling = printer["gcode_macro _START_PRINT"].zforce_leveling|default(False) %}
    {% set auto_alignment = printer["gcode_macro _TEST_POINT"].temp_z_offset|default(0.0)|float %}
    {% set active_profile = printer.bed_mesh.profile_name|default("")|string %}
    {% set matrix = printer.bed_mesh.probed_matrix|default([]) %}

    {% set ns = namespace(reference_ok=False, current_reference=999.0) %}
    {% if matrix|length == 5 and matrix[2]|length == 5 %}
        {% set ns.current_reference = matrix[2][2]|float %}
        {% if (ns.current_reference - saved_reference)|abs <= reference_tolerance %}
            {% set ns.reference_ok = True %}
        {% endif %}
    {% endif %}

    {% if screen != False or load_zoffset != 1 or print_leveling != 0 or force_kamp == True or force_leveling == True %}
        LOAD_GCODE_OFFSET
        _AD5X_Z_RC_ABORT_PATH
    {% elif mesh_test != 3 %}
        LOAD_GCODE_OFFSET
        _AD5X_Z_RC_ABORT_MODE MODE={mesh_test}
    {% elif active_profile != saved_profile %}
        LOAD_GCODE_OFFSET
        _AD5X_Z_RC_ABORT_PROFILE PROFILE="{active_profile}"
    {% elif not ns.reference_ok %}
        LOAD_GCODE_OFFSET
        _AD5X_Z_RC_ABORT_REFERENCE CURRENT={ns.current_reference} EXPECTED={saved_reference}
    {% elif auto_alignment|abs >= max_auto_alignment %}
        LOAD_GCODE_OFFSET
        _AD5X_Z_RC_ABORT_ALIGNMENT DELTA={auto_alignment} LIMIT={max_auto_alignment}
    {% else %}
        RESPOND PREFIX="info" MSG="Plugins AD5X saved+check PASS: policy={policy_id} mesh={active_profile} reference={ns.current_reference|round(6)} Auto-Z={auto_alignment|round(4)} mm"
    {% endif %}
