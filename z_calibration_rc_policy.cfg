# Plugins AD5X owner RC v1 — pure Klipper saved+check policy guard.
#
# This file intentionally defines no _USER_START_PRINT owner. Live integration
# must chain it after the existing hook owner (currently Calibration Center's
# CC_APPLY_PROFILE) instead of creating a duplicate Klipper section.
#
# RC delegates physical contact/temporary Z adjustment to Z-Mod MESH_TEST=3.
# Saved and freshly-built meshes must both finish with native AutoZOffset reconciliation.
#
# Public ADZ_* actions below are semantic wrappers only. ADZ is the
# parser-safe Plugins AD5X Z-calibration G-Code namespace: Klipper requires
# digits in macro command names to appear only at the end. These wrappers do
# not contain PROBE/G0/G1/direct SET_GCODE_OFFSET commands. Physical
# motion/contact remains implemented by Z-Mod macros.

# Hardware-validated AD5X measurement policy (2026-08-24).
# Keep Z-Mod/native probe defaults for cleaning and unrelated probe users.
# Mesh acquisition is a fast relative-shape measurement; only the final
# in-mesh reconciliation probe uses the slow precision policy. Physical motion
# remains Z-Mod-owned.
[gcode_macro _ADZ_MEASUREMENT_POLICY]
variable_policy_id: "adz-metrology-mesh5-median3-final05-median3-bias130-reuse-v3-20260825"
variable_mesh_probe_speed: 5.0
variable_mesh_probe_samples: 3
variable_mesh_probe_result: "median"
variable_final_probe_speed: 0.5
variable_final_probe_samples: 3
variable_final_probe_result: "median"
variable_mesh_final_bias: 0.130000
variable_final_probe_armed: 0
variable_final_probe_x: 0.0
variable_final_probe_y: 0.0
variable_fresh_mesh_built: 0
variable_fresh_native_check_done: 0
gcode:

[gcode_macro _BED_MESH_CALIBRATE]
rename_existing: _ADZ_BED_MESH_CALIBRATE_BASE
gcode:
    {% set m = printer["gcode_macro _ADZ_MEASUREMENT_POLICY"] %}
    {% set built_for_print = printer.print_stats.state|default("unknown")|string == "printing" %}
    SET_GCODE_VARIABLE MACRO=_ADZ_MEASUREMENT_POLICY VARIABLE=fresh_mesh_built VALUE=0
    SET_GCODE_VARIABLE MACRO=_ADZ_MEASUREMENT_POLICY VARIABLE=fresh_native_check_done VALUE=0
    _ADZ_BED_MESH_CALIBRATE_BASE {rawparams} PROBE_SPEED={m.mesh_probe_speed} SAMPLES={m.mesh_probe_samples} SAMPLES_RESULT={m.mesh_probe_result}
    {% if built_for_print %}
        SET_GCODE_VARIABLE MACRO=_ADZ_MEASUREMENT_POLICY VARIABLE=fresh_mesh_built VALUE=1
    {% endif %}

[gcode_macro PROBE]
rename_existing: _ADZ_PROBE_BASE
gcode:
    {% set m = printer["gcode_macro _ADZ_MEASUREMENT_POLICY"] %}
    {% set state = printer.print_stats.state|default("unknown")|string %}
    {% set x = printer.gcode_move.gcode_position.x|float %}
    {% set y = printer.gcode_move.gcode_position.y|float %}
    {% set final_match = m.final_probe_armed|int == 1 and state == "printing" and (x - m.final_probe_x|float)|abs <= 0.05 and (y - m.final_probe_y|float)|abs <= 0.05 %}
    SET_GCODE_VARIABLE MACRO=_ADZ_MEASUREMENT_POLICY VARIABLE=final_probe_armed VALUE=0
    {% if final_match %}
        _ADZ_PROBE_BASE {rawparams} PROBE_SPEED={m.final_probe_speed} SAMPLES={m.final_probe_samples} SAMPLES_RESULT={m.final_probe_result}
        {% if m.fresh_mesh_built|int == 1 %}
            SET_GCODE_VARIABLE MACRO=_ADZ_MEASUREMENT_POLICY VARIABLE=fresh_native_check_done VALUE=1
        {% endif %}
    {% else %}
        _ADZ_PROBE_BASE {rawparams}
    {% endif %}

[gcode_macro _ADZ_RC_ABORT_MESH_POLICY]
gcode:
    {% set expected = params.EXPECTED|default("unknown")|string %}
    {% set actual = params.ACTUAL|default("missing")|string %}
    {% set profile = params.PROFILE|default("none")|string %}
    {action_raise_error("Plugins AD5X Z RC: mesh '%s' measurement policy '%s' is not accepted; expected '%s'. Rebuild the mesh with the current Z policy before saved-mesh Auto-Z." % (profile, actual, expected))}

# Policy wrapper only. Physical tare remains Z-Mod _LOAD_CELL_TARE.
# Fresh-rebuild bootstrap is intentionally not fingerprint-gated. The initial
# cleaning TARE delegates natively; a print-time bed-mesh build then sets a
# transient proof bit used by the native/final reconciliation path.
[gcode_macro LOAD_CELL_TARE]
variable_adz_reuse_armed: 0
gcode:
    {% set measurement = printer["gcode_macro _ADZ_MEASUREMENT_POLICY"] %}
    {% set v = printer.save_variables.variables %}
    {% set state = printer.print_stats.state|default("unknown")|string %}
    {% set screen = printer["gcode_macro _SCREEN"].screen %}
    {% set print_leveling = v["print_leveling"]|default(0)|int %}
    {% set force_kamp = printer["gcode_macro _START_PRINT"].zforce_kamp|default(False) %}
    {% set force_leveling = printer["gcode_macro _START_PRINT"].zforce_leveling|default(False) %}
    {% set fresh_context = force_kamp == True or force_leveling == True or (print_leveling != 0 and screen == False) %}
    {% set active_profile = printer.bed_mesh.profile_name|default("")|string %}
    {% set mesh_min = printer.bed_mesh.mesh_min|default((0.0, 0.0)) %}
    {% set mesh_max = printer.bed_mesh.mesh_max|default((0.0, 0.0)) %}
    {% set points = printer.bed_mesh.probed_matrix|default([]) %}
    {% set x = printer.gcode_move.gcode_position.x|float %}
    {% set y = printer.gcode_move.gcode_position.y|float %}
    {% set stored_policy = v['adz_mesh_policy']|default("")|string %}
    {% set stored_profile = v['adz_mesh_profile']|default("")|string %}
    {% set stored_points = v['adz_mesh_points']|default([]) %}
    {% set persistent_match = active_profile != "" and stored_policy == measurement.policy_id and stored_profile == active_profile and stored_points == points %}
    {% set fresh_match = active_profile != "" and (measurement.fresh_mesh_built|int == 1 or fresh_context) %}
    {% set edge_tare = active_profile != "" and y < (mesh_min[1]|float - 0.5) %}
    {% set inside_mesh = active_profile != "" and x >= (mesh_min[0]|float - 0.5) and x <= (mesh_max[0]|float + 0.5) and y >= (mesh_min[1]|float - 0.5) and y <= (mesh_max[1]|float + 0.5) %}
    {% set armed = printer["gcode_macro LOAD_CELL_TARE"].adz_reuse_armed|default(0)|int %}

    {% if state == "printing" and edge_tare %}
        SET_GCODE_VARIABLE MACRO=LOAD_CELL_TARE VARIABLE=adz_reuse_armed VALUE=0
        SET_GCODE_VARIABLE MACRO=_ADZ_MEASUREMENT_POLICY VARIABLE=final_probe_armed VALUE=0
        {% if not persistent_match and not fresh_match %}
            _ADZ_RC_ABORT_MESH_POLICY EXPECTED="{measurement.policy_id}" ACTUAL="{stored_policy}" PROFILE="{active_profile}"
        {% else %}
            _LOAD_CELL_TARE
            SET_GCODE_VARIABLE MACRO=LOAD_CELL_TARE VARIABLE=adz_reuse_armed VALUE=1
            RESPOND PREFIX="info" MSG="Plugins AD5X metrology: native edge TARE accepted; reuse armed for {active_profile}"
        {% endif %}
    {% elif state == "printing" and armed == 1 and inside_mesh %}
        SET_GCODE_VARIABLE MACRO=LOAD_CELL_TARE VARIABLE=adz_reuse_armed VALUE=0
        SET_GCODE_VARIABLE MACRO=_ADZ_MEASUREMENT_POLICY VARIABLE=final_probe_armed VALUE=1
        SET_GCODE_VARIABLE MACRO=_ADZ_MEASUREMENT_POLICY VARIABLE=final_probe_x VALUE={x}
        SET_GCODE_VARIABLE MACRO=_ADZ_MEASUREMENT_POLICY VARIABLE=final_probe_y VALUE={y}
        RESPOND PREFIX="info" MSG="Plugins AD5X metrology: reusing edge TARE; precision final probe armed"
    {% else %}
        SET_GCODE_VARIABLE MACRO=LOAD_CELL_TARE VARIABLE=adz_reuse_armed VALUE=0
        SET_GCODE_VARIABLE MACRO=_ADZ_MEASUREMENT_POLICY VARIABLE=final_probe_armed VALUE=0
        SET_GCODE_VARIABLE MACRO=_ADZ_MEASUREMENT_POLICY VARIABLE=fresh_mesh_built VALUE=0
        SET_GCODE_VARIABLE MACRO=_ADZ_MEASUREMENT_POLICY VARIABLE=fresh_native_check_done VALUE=0
        _LOAD_CELL_TARE
    {% endif %}

[gcode_macro _ADZ_RECORD_MESH_POLICY]
gcode:
    {% set measurement = printer["gcode_macro _ADZ_MEASUREMENT_POLICY"] %}
    {% set profile = printer.bed_mesh.profile_name|default("")|string %}
    {% set points = printer.bed_mesh.probed_matrix|default([]) %}
    {% if profile == "" or points|length == 0 %}
        _ADZ_RC_ABORT_PATH
    {% else %}
        SAVE_VARIABLE VARIABLE=adz_mesh_policy VALUE="\"{measurement.policy_id}\""
        SAVE_VARIABLE VARIABLE=adz_mesh_profile VALUE="\"{profile}\""
        SAVE_VARIABLE VARIABLE=adz_mesh_points VALUE="{points}"
        RESPOND PREFIX="info" MSG="Plugins AD5X metrology: mesh '{profile}' fingerprinted as {measurement.policy_id}"
    {% endif %}

[gcode_macro _ADZ_RC_ABORT_MODE]
gcode:
    {% set mode = params.MODE|default(-1)|int %}
    {action_raise_error("Plugins AD5X Z RC: MESH_TEST=%d rejected; unattended saved+check requires MESH_TEST=3 or disabled mode 0" % mode)}

[gcode_macro _ADZ_RC_ABORT_PATH]
gcode:
    {action_raise_error("Plugins AD5X Z RC: job requested a calibration path whose final mesh provenance is not yet accepted by Plugins AD5X.")}

[gcode_macro _ADZ_RC_ABORT_PROFILE]
gcode:
    {% set profile = params.PROFILE|default("none")|string %}
    {action_raise_error("Plugins AD5X Z RC: active mesh '%s' is not accepted profile 'auto'." % profile)}


[gcode_macro _ADZ_RC_ABORT_ALIGNMENT]
gcode:
    {% set delta = params.DELTA|default(0.0)|float %}
    {% set expected = params.EXPECTED|default(0.0)|float %}
    {% set residual = params.RESIDUAL|default(0.0)|float %}
    {% set limit = params.LIMIT|default(0.0)|float %}
    {action_raise_error("Plugins AD5X Z RC: Auto-Z %.4f mm has residual %.4f mm from expected split-speed bias %.4f mm; accepted residual < %.4f mm; hardware/measurement change suspected." % (delta, residual, expected, limit))}

[gcode_macro _ADZ_PREPRINT_DISABLED]
gcode:
    SET_GCODE_VARIABLE MACRO=_TEST_POINT VARIABLE=temp_z_offset VALUE=0.0
    LOAD_GCODE_OFFSET
    RESPOND PREFIX="info" MSG="Plugins AD5X: автоматическая Z-калибровка перед печатью выключена; Auto-Z сброшен, сохранённая пользовательская коррекция применена"

[gcode_macro _ADZ_VALIDATE_NATIVE_RESULT]
gcode:
    {% set policy = printer["gcode_macro _ADZ_SAVED_CHECK_POLICY"] %}
    {% set measurement = printer["gcode_macro _ADZ_MEASUREMENT_POLICY"] %}
    {% set auto_alignment = printer["gcode_macro _TEST_POINT"].temp_z_offset|default(0.0)|float %}
    {% set active_profile = printer.bed_mesh.profile_name|default("")|string %}
    {% set expected = measurement.mesh_final_bias|float %}
    {% set residual = auto_alignment - expected %}
    {% set limit = policy.max_bias_residual|float %}
    {% if residual|abs >= limit %}
        LOAD_GCODE_OFFSET
        _ADZ_RC_ABORT_ALIGNMENT DELTA={auto_alignment} EXPECTED={expected} RESIDUAL={residual} LIMIT={limit}
    {% else %}
        RESPOND PREFIX="info" MSG="Plugins AD5X native Auto-Z PASS: mesh={active_profile} raw={auto_alignment|round(4)} mm expected_bias={expected|round(4)} mm residual={residual|round(4)} mm"
    {% endif %}

[gcode_macro _ADZ_RC_ABORT_PRIME]
gcode:
    {% set delegate = params.DELEGATE|default("none")|string %}
    {action_raise_error("Plugins AD5X Z RC: unsafe/missing priming delegate '%s'; refusing to bypass pre-prime Z finalization." % delegate)}

[gcode_macro _ADZ_PRIME_GATE]
variable_fresh_finalized: 0
gcode:
    {% set v = printer.save_variables.variables %}
    {% set delegate = v['adz_prime_delegate']|default("")|string %}
    {% if delegate == "" or delegate == "_ADZ_PRIME_GATE" %}
        _ADZ_RC_ABORT_PRIME DELEGATE="{delegate}"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_ADZ_PRIME_GATE VARIABLE=fresh_finalized VALUE=0
        SET_GCODE_VARIABLE MACRO=LOAD_CELL_TARE VARIABLE=adz_reuse_armed VALUE=0
        SET_GCODE_VARIABLE MACRO=_ADZ_MEASUREMENT_POLICY VARIABLE=final_probe_armed VALUE=0
        _ADZ_SAVED_CHECK_POLICY PRE_PRIME=1
        {delegate}
    {% endif %}

[gcode_macro _ADZ_PREPRINT_FRESH_MESH]
gcode:
    {% set profile = printer.bed_mesh.profile_name|default("")|string %}
    {% set saved_profile = printer["gcode_macro _ADZ_SAVED_CHECK_POLICY"].saved_profile|string %}
    {% set measurement = printer["gcode_macro _ADZ_MEASUREMENT_POLICY"] %}
    {% if measurement.fresh_native_check_done|int == 1 %}
        RESPOND PREFIX="info" MSG="Plugins AD5X: fresh mesh '{profile}' already passed native Z-Mod AutoZOffset; validating result"
        _ADZ_VALIDATE_NATIVE_RESULT
    {% else %}
        RESPOND PREFIX="info" MSG="Plugins AD5X: fresh mesh '{profile}' requires final native Z-Mod AutoZOffset"
        LOAD_GCODE_OFFSET
        _MESH_TEST
        _ADZ_VALIDATE_NATIVE_RESULT
    {% endif %}
    {% if profile == saved_profile %}
        _ADZ_RECORD_MESH_POLICY
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_ADZ_MEASUREMENT_POLICY VARIABLE=fresh_mesh_built VALUE=0
    SET_GCODE_VARIABLE MACRO=_ADZ_MEASUREMENT_POLICY VARIABLE=fresh_native_check_done VALUE=0

[gcode_macro _ADZ_SAVED_CHECK_POLICY]
variable_policy_id: "zcal-saved-check-v1-20260817"
variable_max_auto_alignment: 0.120000
variable_max_bias_residual: 0.050000
variable_saved_profile: "auto"
gcode:
    {% set v = printer.save_variables.variables %}
    {% set screen = printer["gcode_macro _SCREEN"].screen %}
    {% set load_zoffset = v['load_zoffset']|default(1)|int %}
    {% set mesh_test = v['mesh_test']|default(1)|int %}
    {% set print_leveling = v['print_leveling']|default(0)|int %}
    {% set force_kamp = printer["gcode_macro _START_PRINT"].zforce_kamp|default(False) %}
    {% set force_leveling = printer["gcode_macro _START_PRINT"].zforce_leveling|default(False) %}
    {% set auto_alignment = printer["gcode_macro _TEST_POINT"].temp_z_offset|default(0.0)|float %}
    {% set active_profile = printer.bed_mesh.profile_name|default("")|string %}
    {% set measurement = printer["gcode_macro _ADZ_MEASUREMENT_POLICY"] %}
    {% set expected_bias = measurement.mesh_final_bias|float %}
    {% set bias_residual = auto_alignment - expected_bias %}
    {% set max_bias_residual = printer["gcode_macro _ADZ_SAVED_CHECK_POLICY"].max_bias_residual|float %}
    {% set active_points = printer.bed_mesh.probed_matrix|default([]) %}
    {% set stored_policy = v['adz_mesh_policy']|default("")|string %}
    {% set stored_profile = v['adz_mesh_profile']|default("")|string %}
    {% set stored_points = v['adz_mesh_points']|default([]) %}
    {% set mesh_policy_match = stored_policy == measurement.policy_id and stored_profile == active_profile and stored_points == active_points %}
    {% set pre_prime = params.PRE_PRIME|default(0)|int %}
    {% set fresh_finalized = printer["gcode_macro _ADZ_PRIME_GATE"].fresh_finalized|default(0)|int %}
    {% set fresh_mesh_proven = measurement.fresh_mesh_built|int == 1 or force_kamp == True or force_leveling == True or (print_leveling != 0 and screen == False) %}
    {% set native_leveling_ambiguous = print_leveling != 0 and screen != False %}

    {% if mesh_test == 0 %}
        _ADZ_PREPRINT_DISABLED
    {% elif mesh_test != 3 %}
        LOAD_GCODE_OFFSET
        _ADZ_RC_ABORT_MODE MODE={mesh_test}
    {% elif native_leveling_ambiguous %}
        LOAD_GCODE_OFFSET
        _ADZ_RC_ABORT_PATH
    {% elif screen != False or load_zoffset != 1 %}
        LOAD_GCODE_OFFSET
        _ADZ_RC_ABORT_PATH
    {% elif fresh_mesh_proven and pre_prime == 1 %}
        _ADZ_PREPRINT_FRESH_MESH
        SET_GCODE_VARIABLE MACRO=_ADZ_PRIME_GATE VARIABLE=fresh_finalized VALUE=1
    {% elif fresh_mesh_proven and fresh_finalized == 1 %}
        _ADZ_VALIDATE_NATIVE_RESULT
    {% elif fresh_mesh_proven %}
        LOAD_GCODE_OFFSET
        _ADZ_RC_ABORT_PATH
    {% elif print_leveling != 0 or force_kamp == True or force_leveling == True %}
        LOAD_GCODE_OFFSET
        _ADZ_RC_ABORT_PATH
    {% elif active_profile != saved_profile %}
        LOAD_GCODE_OFFSET
        _ADZ_RC_ABORT_PROFILE PROFILE="{active_profile}"
    {% elif not mesh_policy_match %}
        LOAD_GCODE_OFFSET
        _ADZ_RC_ABORT_MESH_POLICY EXPECTED="{measurement.policy_id}" ACTUAL="{stored_policy}" PROFILE="{active_profile}"
    {% elif bias_residual|abs >= max_bias_residual %}
        LOAD_GCODE_OFFSET
        _ADZ_RC_ABORT_ALIGNMENT DELTA={auto_alignment} EXPECTED={expected_bias} RESIDUAL={bias_residual} LIMIT={max_bias_residual}
    {% else %}
        RESPOND PREFIX="info" MSG="Plugins AD5X saved+check PASS: policy={policy_id} mesh={active_profile} raw={auto_alignment|round(4)} mm expected_bias={expected_bias|round(4)} mm residual={bias_residual|round(4)} mm"
    {% endif %}

[gcode_macro _ADZ_ACTION_CONTRACT]
variable_contract_version: 3
variable_runtime_profile: "ad5x_runtime"
variable_preprint_enabled_mode: 3
variable_preprint_disabled_mode: 0
gcode:

[gcode_macro _ADZ_ACTION_ABORT_BUSY]
gcode:
    {% set state = params.STATE|default("unknown")|string %}
    {action_raise_error("Plugins AD5X Z action rejected: printer state '%s' is not idle." % state)}

[gcode_macro _ADZ_ACTION_ABORT_TEMP]
gcode:
    {% set nozzle = params.NOZZLE|default(-1)|float %}
    {% set bed = params.BED|default(-1)|float %}
    {action_raise_error("Plugins AD5X Z action rejected: explicit calibration temperatures are invalid (nozzle %.1f C, bed %.1f C)." % (nozzle, bed))}

[gcode_macro _ADZ_ACTION_ABORT_BOOLEAN]
gcode:
    {% set value = params.VALUE|default(-1)|int %}
    {action_raise_error("Plugins AD5X Z action rejected: ENABLED must be 0 or 1, got %d." % value)}

[gcode_macro ADZ_SET_PREPRINT]
description: Persistently enable or disable automatic Plugins AD5X pre-print Z calibration
gcode:
    {% set state = printer.print_stats.state|default("unknown")|string %}
    {% set enabled = params.ENABLED|default(-1)|int %}
    {% set contract = printer["gcode_macro _ADZ_ACTION_CONTRACT"] %}

    {% if state == "printing" or state == "paused" %}
        _ADZ_ACTION_ABORT_BUSY STATE="{state}"
    {% elif enabled == 1 %}
        SAVE_VARIABLE VARIABLE=mesh_test VALUE={contract.preprint_enabled_mode|int}
        RESPOND PREFIX="info" MSG="Plugins AD5X: автоматическая Z-калибровка перед печатью включена (MESH_TEST=3)"
    {% elif enabled == 0 %}
        SAVE_VARIABLE VARIABLE=mesh_test VALUE={contract.preprint_disabled_mode|int}
        SET_GCODE_VARIABLE MACRO=_TEST_POINT VARIABLE=temp_z_offset VALUE=0.0
        LOAD_GCODE_OFFSET
        RESPOND PREFIX="info" MSG="Plugins AD5X: автоматическая Z-калибровка перед печатью выключена (MESH_TEST=0)"
    {% else %}
        _ADZ_ACTION_ABORT_BOOLEAN VALUE={enabled}
    {% endif %}

[gcode_macro ADZ_CHECK]
description: Plugins AD5X semantic saved-mesh Z check delegated to Z-Mod
gcode:
    {% set state = printer.print_stats.state|default("unknown")|string %}
    {% set extruder_temp = params.EXTRUDER_TEMP|default(-1)|float %}
    {% set bed_temp = params.BED_TEMP|default(-1)|float %}
    {% set extruder_min = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}
    {% set extruder_max = printer.configfile.settings.extruder.max_temp|default(300)|float - 5.0 %}
    {% set bed_max = printer.configfile.settings.heater_bed.max_temp|default(120)|float - 5.0 %}
    {% set old_extruder_temp = printer["gcode_macro _START_PRINT"].zextruder_temp|float %}
    {% set old_bed_temp = printer["gcode_macro _START_PRINT"].zbed_temp|float %}
    {% set mesh_test = printer.save_variables.variables['mesh_test']|default(1)|int %}

    {% if state == "printing" or state == "paused" %}
        _ADZ_ACTION_ABORT_BUSY STATE="{state}"
    {% elif mesh_test != 3 %}
        _ADZ_RC_ABORT_MODE MODE={mesh_test}
    {% elif extruder_temp < extruder_min or extruder_temp > extruder_max or bed_temp < 30.0 or bed_temp > bed_max %}
        _ADZ_ACTION_ABORT_TEMP NOZZLE={extruder_temp} BED={bed_temp}
    {% else %}
        LOAD_GCODE_OFFSET
        _ADZ_SAVED_CHECK_POLICY

        SET_GCODE_VARIABLE MACRO=_START_PRINT VARIABLE=zextruder_temp VALUE={extruder_temp}
        SET_GCODE_VARIABLE MACRO=_START_PRINT VARIABLE=zbed_temp VALUE={bed_temp}

        RESPOND PREFIX="info" MSG="Plugins AD5X: Проверить Z; Z-Mod _MESH_TEST; nozzle={extruder_temp}; bed={bed_temp}"
        _MESH_TEST

        _ADZ_SAVED_CHECK_POLICY

        SET_GCODE_VARIABLE MACRO=_START_PRINT VARIABLE=zextruder_temp VALUE={old_extruder_temp}
        SET_GCODE_VARIABLE MACRO=_START_PRINT VARIABLE=zbed_temp VALUE={old_bed_temp}
        RESPOND PREFIX="info" MSG="Plugins AD5X: Проверить Z завершено"
    {% endif %}

[gcode_macro ADZ_BUILD_RUNTIME_MESH]
description: Plugins AD5X semantic temporary full mesh delegated to Z-Mod
gcode:
    {% set state = printer.print_stats.state|default("unknown")|string %}
    {% set extruder_temp = params.EXTRUDER_TEMP|default(-1)|float %}
    {% set bed_temp = params.BED_TEMP|default(-1)|float %}
    {% set extruder_min = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}
    {% set extruder_max = printer.configfile.settings.extruder.max_temp|default(300)|float - 5.0 %}
    {% set bed_max = printer.configfile.settings.heater_bed.max_temp|default(120)|float - 5.0 %}
    {% set runtime_profile = printer["gcode_macro _ADZ_ACTION_CONTRACT"].runtime_profile|string %}

    {% if state == "printing" or state == "paused" %}
        _ADZ_ACTION_ABORT_BUSY STATE="{state}"
    {% elif extruder_temp < extruder_min or extruder_temp > extruder_max or bed_temp < 30.0 or bed_temp > bed_max %}
        _ADZ_ACTION_ABORT_TEMP NOZZLE={extruder_temp} BED={bed_temp}
    {% else %}
        LOAD_GCODE_OFFSET
        _ADZ_SAVED_CHECK_POLICY

        RESPOND PREFIX="info" MSG="Plugins AD5X: временная карта {runtime_profile}; nozzle={extruder_temp}; bed={bed_temp}"
        AUTO_FULL_BED_LEVEL EXTRUDER_TEMP={extruder_temp} BED_TEMP={bed_temp} PROFILE={runtime_profile}

        BED_MESH_PROFILE LOAD=auto FROM=ADZ_BUILD_RUNTIME_MESH
        LOAD_GCODE_OFFSET
        _ADZ_SAVED_CHECK_POLICY
        RESPOND PREFIX="info" MSG="Plugins AD5X: временная карта {runtime_profile} готова; active mesh restored to auto"
    {% endif %}

[gcode_macro ADZ_RESTORE_AUTO]
description: Restore accepted saved auto mesh after a failed/aborted runtime action
gcode:
    {% set state = printer.print_stats.state|default("unknown")|string %}
    {% if state == "printing" or state == "paused" %}
        _ADZ_ACTION_ABORT_BUSY STATE="{state}"
    {% else %}
        BED_MESH_PROFILE LOAD=auto FROM=ADZ_RESTORE_AUTO
        LOAD_GCODE_OFFSET
        _ADZ_SAVED_CHECK_POLICY
        RESPOND PREFIX="info" MSG="Plugins AD5X: saved auto mesh restored"
    {% endif %}

# Legacy observer compatibility object. It is deliberately never invoked as
# G-Code: names with an embedded digit are not parser-safe in Klipper. Keep it
