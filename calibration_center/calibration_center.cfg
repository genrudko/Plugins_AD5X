# CALIBRATION-CENTER-001
# Lightweight/event-driven AD5X calibration. No daemon, no MCU changes.
# Requires current Z-Mod AD5X primitives. Installed through mod_data/plugins.cfg.

[gcode_shell_command calibration_center_audit]
command: /opt/config/mod_data/plugins/calibration_center/calibration_center/cc_audit.sh
timeout: 5
verbose: False

[gcode_macro _CC_STATE]
# Volatile run state. Persistent profile state lives in save_variables.
variable_run_active: 0
variable_slot: 0
variable_s1: 9999.0
variable_s2: 9999.0
variable_s3: 9999.0
variable_s4: 9999.0
variable_s5: 9999.0
variable_max_range: 0.030
variable_max_delta: 0.300
variable_bed_temp: 60.0
variable_clean_temp: 240.0
variable_measure_temp: 150.0
variable_last_base_runtime: 0.0
variable_last_runtime_auto: 0.0
variable_live_adjust: 0.0
gcode:
    M105

[gcode_macro CALIBRATION_CENTER]
description: Calibration Center — главное меню
gcode:
    {% set v = printer.save_variables.variables %}
    {% set slot = v['cc_active_profile']|default(0)|int %}
    {% set exists = v['cc_p%d_exists' % slot]|default(0)|int if slot > 0 else 0 %}
    {% if exists == 1 %}
        {% set name = v['cc_p%d_name' % slot]|default('Profile %d' % slot)|string %}
        {% set hotend = v['cc_p%d_hotend' % slot]|default('Unknown')|string %}
        {% set nozzle = v['cc_p%d_nozzle' % slot]|default(0.0)|float %}
        {% set state = v['cc_p%d_state' % slot]|default(0)|int %}
        {% set quality = v['cc_p%d_range' % slot]|default(0.0)|float %}
        {% set last_result = v['cc_p%d_last_result' % slot]|default(0)|int %}
        {% set state_text = 'NEW' %}
        {% if state == 1 %}{% set state_text = 'AUTO MEASURED' %}{% endif %}
        {% if state == 2 %}{% set state_text = 'USER VERIFIED' %}{% endif %}
        {% if state == 3 %}{% set state_text = 'REJECTED' %}{% endif %}
        RESPOND TYPE=command MSG="action:prompt_begin Calibration Center"
        RESPOND TYPE=command MSG="action:prompt_text Профиль: {name} | {hotend} | {nozzle} mm"
        RESPOND TYPE=command MSG="action:prompt_text Статус: {state_text} | принятая повторяемость: {quality|round(4)} mm"
        {% if last_result == 3 and state == 2 %}
            RESPOND TYPE=command MSG="action:prompt_text ⚠ Последняя попытка отклонена; предыдущая USER VERIFIED калибровка сохранена"
        {% endif %}
        RESPOND TYPE=command MSG="action:prompt_button Калибровать автоматически|CC_CALIBRATE|primary"
        RESPOND TYPE=command MSG="action:prompt_button Профили|CC_PROFILES|secondary"
        RESPOND TYPE=command MSG="action:prompt_button Проверка первого слоя|CC_FIRST_LAYER_CONTROLS|secondary"
        RESPOND TYPE=command MSG="action:prompt_button Восстановить предыдущую|CC_ROLLBACK|warning"
        RESPOND TYPE=command MSG="action:prompt_footer_button Закрыть|RESPOND TYPE=command MSG=action:prompt_end"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_begin Calibration Center"
        RESPOND TYPE=command MSG="action:prompt_text Профиль ещё не выбран. Создайте типовой профиль или откройте список."
        RESPOND TYPE=command MSG="action:prompt_button Stock / 0.4|CC_PROFILE_CREATE SLOT=1 HOTEND=Stock NOZZLE=0.4 NAME=Stock_0.4|primary"
        RESPOND TYPE=command MSG="action:prompt_button A1 / 0.4|CC_PROFILE_CREATE SLOT=1 HOTEND=A1 NOZZLE=0.4 NAME=A1_0.4|primary"
        RESPOND TYPE=command MSG="action:prompt_button A1 / 0.6|CC_PROFILE_CREATE SLOT=1 HOTEND=A1 NOZZLE=0.6 NAME=A1_0.6|secondary"
        RESPOND TYPE=command MSG="action:prompt_button A1 / 0.8|CC_PROFILE_CREATE SLOT=1 HOTEND=A1 NOZZLE=0.8 NAME=A1_0.8|secondary"
        RESPOND TYPE=command MSG="action:prompt_button Профили|CC_PROFILES|secondary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Закрыть|RESPOND TYPE=command MSG=action:prompt_end"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro CC_PROFILES]
description: Calibration Center — список профилей
gcode:
    {% set v = printer.save_variables.variables %}
    {% set active = v['cc_active_profile']|default(0)|int %}
    RESPOND TYPE=command MSG="action:prompt_begin Профили хотэндов / сопел"
    {% for slot in range(1, 9) %}
        {% if v['cc_p%d_exists' % slot]|default(0)|int == 1 %}
            {% set name = v['cc_p%d_name' % slot]|default('Profile_%d' % slot)|string %}
            {% set nozzle = v['cc_p%d_nozzle' % slot]|default(0.0)|float %}
            {% set marker = '✓ ' if active == slot else '' %}
            RESPOND TYPE=command MSG="action:prompt_button {marker}{slot}: {name} / {nozzle} mm|CC_PROFILE_SELECT SLOT={slot}|primary"
        {% endif %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_text Свободный слот можно создать командой CC_PROFILE_CREATE SLOT=... HOTEND=... NOZZLE=... NAME=..."
    RESPOND TYPE=command MSG="action:prompt_footer_button Назад|CALIBRATION_CENTER"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro CC_PROFILE_CREATE]
description: Создать/заменить профиль SLOT=1..8 HOTEND=A1 NOZZLE=0.4 NAME=A1_0.4
# Generic API; the main prompt creates common profiles without console knowledge.
gcode:
    {% set slot = params.SLOT|default(0)|int %}
    {% set hotend = params.HOTEND|default('Custom')|string|replace("'", '')|replace('"', '') %}
    {% set nozzle = params.NOZZLE|default(0.4)|float %}
    {% set name = params.NAME|default('%s_%s' % (hotend, nozzle))|string|replace("'", '')|replace('"', '') %}
    {% set replace = params.REPLACE|default(0)|int %}
    {% set v = printer.save_variables.variables %}
    {% if slot < 1 or slot > 8 %}
        {action_raise_error('Calibration Center: SLOT должен быть 1..8')}
    {% elif nozzle < 0.1 or nozzle > 2.0 %}
        {action_raise_error('Calibration Center: недопустимый диаметр сопла')}
    {% elif v['cc_p%d_exists' % slot]|default(0)|int == 1 and replace != 1 %}
        {action_raise_error('Calibration Center: слот уже занят; используйте другой слот или REPLACE=1')}
    {% else %}
        SAVE_VARIABLE VARIABLE=cc_p{slot}_exists VALUE=1
        SAVE_VARIABLE VARIABLE=cc_p{slot}_name VALUE='"{name}"'
        SAVE_VARIABLE VARIABLE=cc_p{slot}_hotend VALUE='"{hotend}"'
        SAVE_VARIABLE VARIABLE=cc_p{slot}_nozzle VALUE={nozzle}
        SAVE_VARIABLE VARIABLE=cc_p{slot}_state VALUE=0
        SAVE_VARIABLE VARIABLE=cc_p{slot}_last_result VALUE=0
        SAVE_VARIABLE VARIABLE=cc_p{slot}_last_reject_range VALUE=9999.0
        SAVE_VARIABLE VARIABLE=cc_p{slot}_auto_ref VALUE=9999.0
        SAVE_VARIABLE VARIABLE=cc_p{slot}_mean VALUE=9999.0
        SAVE_VARIABLE VARIABLE=cc_p{slot}_range VALUE=9999.0
        SAVE_VARIABLE VARIABLE=cc_p{slot}_verified_ref VALUE=9999.0
        SAVE_VARIABLE VARIABLE=cc_p{slot}_verified_bias VALUE=0.0
        SAVE_VARIABLE VARIABLE=cc_p{slot}_auto_delta VALUE=0.0
        SAVE_VARIABLE VARIABLE=cc_p{slot}_prev_verified_ref VALUE=9999.0
        SAVE_VARIABLE VARIABLE=cc_p{slot}_prev_verified_bias VALUE=9999.0
        SAVE_VARIABLE VARIABLE=cc_p{slot}_bed_temp VALUE=0.0
        SAVE_VARIABLE VARIABLE=cc_p{slot}_measure_temp VALUE=0.0
        SAVE_VARIABLE VARIABLE=cc_p{slot}_last_epoch VALUE=0
        SAVE_VARIABLE VARIABLE=cc_active_profile VALUE={slot}
        RUN_SHELL_COMMAND CMD=calibration_center_audit PARAMS="profile_create {slot} {name} {hotend} {nozzle}"
        RESPOND TYPE=command MSG="action:prompt_end"
        RESPOND PREFIX="info" MSG="Calibration Center: создан и выбран профиль {name}"
        CALIBRATION_CENTER
    {% endif %}

[gcode_macro CC_PROFILE_SELECT]
description: Выбрать профиль SLOT=1..8
gcode:
    {% set slot = params.SLOT|default(0)|int %}
    {% set v = printer.save_variables.variables %}
    {% if slot < 1 or slot > 8 or v['cc_p%d_exists' % slot]|default(0)|int != 1 %}
        {action_raise_error('Calibration Center: профиль не существует')}
    {% elif printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error('Calibration Center: нельзя менять профиль во время печати')}
    {% else %}
        SAVE_VARIABLE VARIABLE=cc_active_profile VALUE={slot}
        RUN_SHELL_COMMAND CMD=calibration_center_audit PARAMS="profile_select {slot}"
        RESPOND TYPE=command MSG="action:prompt_end"
        RESPOND PREFIX="info" MSG="Calibration Center: профиль {slot} выбран"
        CALIBRATION_CENTER
    {% endif %}

[gcode_macro CC_PROFILE_RENAME]
description: Переименовать профиль SLOT=1 NAME=...
gcode:
    {% set slot = params.SLOT|default(0)|int %}
    {% set name = params.NAME|default('')|string|replace("'", '')|replace('"', '') %}
    {% set v = printer.save_variables.variables %}
    {% if slot < 1 or slot > 8 or v['cc_p%d_exists' % slot]|default(0)|int != 1 %}
        {action_raise_error('Calibration Center: профиль не существует')}
    {% elif name|length < 1 or name|length > 40 %}
        {action_raise_error('Calibration Center: NAME должен содержать 1..40 символов')}
    {% elif printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error('Calibration Center: нельзя переименовывать профиль во время печати')}
    {% else %}
        SAVE_VARIABLE VARIABLE=cc_p{slot}_name VALUE='"{name}"'
        RUN_SHELL_COMMAND CMD=calibration_center_audit PARAMS="profile_rename {slot} {name}"
        RESPOND PREFIX="info" MSG="Calibration Center: профиль {slot} переименован в {name}"
    {% endif %}

[gcode_macro CC_CALIBRATE]
description: Автоматически измерить физический Z-reference (5 независимых probe)
gcode:
    {% set v = printer.save_variables.variables %}
    {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    {% set slot = params.SLOT|default(v['cc_active_profile']|default(0))|int %}
    {% set bed_temp = params.BED_TEMP|default(60)|float %}
    {% set clean_temp = params.CLEAN_TEMP|default(240)|float %}
    {% set measure_temp = params.MEASURE_TEMP|default(150)|float %}
    {% set max_range = params.MAX_RANGE|default(0.030)|float %}
    {% set max_delta = params.MAX_DELTA|default(0.300)|float %}
    {% set epoch = params.EPOCH|default(0)|int %}
    {% if not client.ad5x %}
        {action_raise_error('Calibration Center: поддерживается только AD5X')}
    {% elif printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error('Calibration Center: принтер занят печатью')}
    {% elif slot < 1 or slot > 8 or v['cc_p%d_exists' % slot]|default(0)|int != 1 %}
        {action_raise_error('Calibration Center: сначала выберите существующий профиль')}
    {% elif bed_temp < 0 or bed_temp > 120 %}
        {action_raise_error('Calibration Center: BED_TEMP вне безопасного диапазона 0..120 C')}
    {% elif clean_temp < 180 or clean_temp > 280 %}
        {action_raise_error('Calibration Center: CLEAN_TEMP вне диапазона 180..280 C')}
    {% elif measure_temp < 100 or measure_temp > 180 %}
        {action_raise_error('Calibration Center: MEASURE_TEMP вне диапазона 100..180 C')}
    {% elif max_range < 0.005 or max_range > 0.100 %}
        {action_raise_error('Calibration Center: MAX_RANGE вне диапазона 0.005..0.100 mm')}
    {% elif max_delta < 0.050 or max_delta > 0.500 %}
        {action_raise_error('Calibration Center: MAX_DELTA вне диапазона 0.050..0.500 mm')}
    {% elif printer['gcode_macro _CC_STATE'].run_active|int == 1 %}
        {action_raise_error('Calibration Center: калибровка уже выполняется')}
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_end"
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=run_active VALUE=1
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=slot VALUE={slot}
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=s1 VALUE=9999.0
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=s2 VALUE=9999.0
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=s3 VALUE=9999.0
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=s4 VALUE=9999.0
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=s5 VALUE=9999.0
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=max_range VALUE={max_range}
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=max_delta VALUE={max_delta}
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=bed_temp VALUE={bed_temp}
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=clean_temp VALUE={clean_temp}
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=measure_temp VALUE={measure_temp}
        SAVE_VARIABLE VARIABLE=cc_p{slot}_last_epoch VALUE={epoch}
        UPDATE_DELAYED_GCODE ID=_CC_FAILSAFE DURATION=900
        RUN_SHELL_COMMAND CMD=calibration_center_audit PARAMS="calibration_start {slot} bed={bed_temp} clean={clean_temp} measure={measure_temp}"
        RESPOND PREFIX="info" MSG="Calibration Center: подготовка и очистка сопла"
        _ORIG_CLEAR_NOZZLE EXTRUDER_TEMP={clean_temp} BED_TEMP={bed_temp}
        M140 S{bed_temp}
        M104 S{measure_temp}
        {% if bed_temp > 0 %}
            TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp-3} MAXIMUM={bed_temp+4}
        {% endif %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={measure_temp-3} MAXIMUM={measure_temp+4}
        _CC_PREPARE_MEASUREMENTS
        _CC_MEASURE INDEX=1
        _CC_MEASURE INDEX=2
        _CC_MEASURE INDEX=3
        _CC_MEASURE INDEX=4
        _CC_MEASURE INDEX=5
        _CC_FINALIZE
    {% endif %}

[gcode_macro _CC_PREPARE_MEASUREMENTS]
gcode:
    {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
    {% set x = (client.min_x|float + client.max_x|float) / 2.0 %}
    {% set y = (client.min_y|float + client.max_y|float) / 2.0 %}
    _G28
    M400
    G90
    G1 X{x} Y{y} F6000
    G1 Z5 F3000
    M400
    RESPOND PREFIX="info" MSG="Calibration Center: безопасная точка измерения X={x} Y={y}"

[gcode_macro _CC_MEASURE]
gcode:
    {% set index = params.INDEX|int %}
    RESPOND PREFIX="info" MSG="Calibration Center: измерение {index}/5"
    LOAD_CELL_TARE
    PROBE
    M400
    _CC_CAPTURE INDEX={index}
    G90
    G1 Z5 F300
    M400

[gcode_macro _CC_CAPTURE]
gcode:
    {% set index = params.INDEX|int %}
    {% set klipper13 = printer.save_variables.variables['klipper13']|default(0)|int %}
    {% if klipper13 == 0 %}
        {% set z = printer.probe.last_z_result|float %}
    {% else %}
        {% set z = printer.probe.last_probe_position.z|float %}
    {% endif %}
    {% if index < 1 or index > 5 %}
        {action_raise_error('Calibration Center: internal sample index error')}
    {% else %}
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=s{index} VALUE={z}
        RESPOND PREFIX="info" MSG="Calibration Center: probe {index} = {z|round(5)} mm"
    {% endif %}

[gcode_macro _CC_FINALIZE]
gcode:
    {% set st = printer['gcode_macro _CC_STATE'] %}
    {% set slot = st.slot|int %}
    {% set v = printer.save_variables.variables %}
    {% set samples = [st.s1|float, st.s2|float, st.s3|float, st.s4|float, st.s5|float] %}
    {% set ordered = samples|sort %}
    {% set minimum = ordered[0]|float %}
    {% set maximum = ordered[4]|float %}
    {% set median = ordered[2]|float %}
    {% set mean = (samples[0]+samples[1]+samples[2]+samples[3]+samples[4]) / 5.0 %}
    {% set spread = maximum - minimum %}
    {% set valid = (minimum < 9000.0 and maximum < 9000.0 and slot >= 1 and slot <= 8) %}
    {% set verified_ref = v['cc_p%d_verified_ref' % slot]|default(9999.0)|float %}
    {% if not valid %}
        SAVE_VARIABLE VARIABLE=cc_p{slot}_last_result VALUE=3
        {% if verified_ref >= 9000.0 %}
            SAVE_VARIABLE VARIABLE=cc_p{slot}_state VALUE=3
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=run_active VALUE=0
        UPDATE_DELAYED_GCODE ID=_CC_FAILSAFE DURATION=0
        TURN_OFF_HEATERS
        RUN_SHELL_COMMAND CMD=calibration_center_audit PARAMS="calibration_reject {slot} reason=incomplete"
        {action_raise_error('Calibration Center: неполная серия измерений. Предыдущая проверенная калибровка сохранена.')}
    {% elif spread > st.max_range|float %}
        SAVE_VARIABLE VARIABLE=cc_p{slot}_last_result VALUE=3
        SAVE_VARIABLE VARIABLE=cc_p{slot}_last_reject_range VALUE={spread}
        {% if verified_ref >= 9000.0 %}
            SAVE_VARIABLE VARIABLE=cc_p{slot}_state VALUE=3
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=run_active VALUE=0
        UPDATE_DELAYED_GCODE ID=_CC_FAILSAFE DURATION=0
        TURN_OFF_HEATERS
        RUN_SHELL_COMMAND CMD=calibration_center_audit PARAMS="calibration_reject {slot} reason=unstable median={median} mean={mean} range={spread}"
        {action_raise_error('Калибровка нестабильна. Проверьте чистоту сопла и установку хотэнда. Предыдущая проверенная калибровка сохранена.')}
    {% elif verified_ref < 9000.0 and (median - verified_ref)|abs > st.max_delta|float %}
        SAVE_VARIABLE VARIABLE=cc_p{slot}_last_result VALUE=3
        SAVE_VARIABLE VARIABLE=cc_p{slot}_last_reject_range VALUE={spread}
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=run_active VALUE=0
        UPDATE_DELAYED_GCODE ID=_CC_FAILSAFE DURATION=0
        TURN_OFF_HEATERS
        RUN_SHELL_COMMAND CMD=calibration_center_audit PARAMS="calibration_reject {slot} reason=delta_limit median={median} verified={verified_ref}"
        {action_raise_error('Calibration Center: геометрический сдвиг слишком велик. Предыдущая проверенная калибровка сохранена; проверьте установку хотэнда/сопла.')}
    {% else %}
        SAVE_VARIABLE VARIABLE=cc_p{slot}_last_result VALUE=1
        SAVE_VARIABLE VARIABLE=cc_p{slot}_auto_ref VALUE={median}
        SAVE_VARIABLE VARIABLE=cc_p{slot}_mean VALUE={mean}
        SAVE_VARIABLE VARIABLE=cc_p{slot}_range VALUE={spread}
        SAVE_VARIABLE VARIABLE=cc_p{slot}_bed_temp VALUE={st.bed_temp|float}
        SAVE_VARIABLE VARIABLE=cc_p{slot}_measure_temp VALUE={st.measure_temp|float}
        {% if verified_ref < 9000.0 %}
            {% set delta = median - verified_ref %}
            SAVE_VARIABLE VARIABLE=cc_p{slot}_auto_delta VALUE={delta}
            SAVE_VARIABLE VARIABLE=cc_p{slot}_state VALUE=2
            RESPOND PREFIX="info" MSG="Calibration Center: reference delta = {delta|round(5)} mm"
        {% else %}
            SAVE_VARIABLE VARIABLE=cc_p{slot}_auto_delta VALUE=0.0
            SAVE_VARIABLE VARIABLE=cc_p{slot}_state VALUE=1
            RESPOND PREFIX="info" MSG="Calibration Center: физический reference измерен; профиль ещё требует первичной проверки первого слоя"
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=run_active VALUE=0
        UPDATE_DELAYED_GCODE ID=_CC_FAILSAFE DURATION=0
        TURN_OFF_HEATERS
        RUN_SHELL_COMMAND CMD=calibration_center_audit PARAMS="calibration_ok {slot} median={median} mean={mean} range={spread}"
        RESPOND PREFIX="info" MSG="Calibration Center: готово. Median={median|round(5)} Mean={mean|round(5)} Range={spread|round(5)} mm"
    {% endif %}

[delayed_gcode _CC_FAILSAFE]
gcode:
    {% if printer['gcode_macro _CC_STATE'].run_active|int == 1 %}
        TURN_OFF_HEATERS
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=run_active VALUE=0
        RUN_SHELL_COMMAND CMD=calibration_center_audit PARAMS="failsafe timeout"
        RESPOND TYPE=error MSG="Calibration Center: аварийный timeout. Нагрев отключён; результат не сохранён."
    {% endif %}

[gcode_macro CC_APPLY_PROFILE]
description: Применить проверенную профильную correction поверх штатного Z-Mod start path
# Intended to be called from the documented Z-Mod _USER_START_PRINT hook.
gcode:
    {% set v = printer.save_variables.variables %}
    {% set slot = v['cc_active_profile']|default(0)|int %}
    {% set enabled = v['cc_enabled']|default(1)|int %}
    {% set exists = v['cc_p%d_exists' % slot]|default(0)|int == 1 if slot > 0 else False %}
    {% set verified = v['cc_p%d_state' % slot]|default(0)|int == 2 if slot > 0 else False %}
    {% if enabled == 1 and exists %}
        # Capture the Z-Mod/native runtime baseline for every selected profile,
        # including a brand-new AUTO MEASURED profile. This is the anchor used
        # by optional first-layer verification; it must never default to zero.
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=last_base_runtime VALUE={printer.gcode_move.homing_origin.z|float}
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=last_runtime_auto VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=live_adjust VALUE=0.0
        {% if verified %}
            {% set bias = v['cc_p%d_verified_bias' % slot]|default(0.0)|float %}
            {% set auto_delta = v['cc_p%d_auto_delta' % slot]|default(0.0)|float %}
            {% set mesh_test = v['mesh_test']|default(1)|int %}
            # Z-Mod MESH_TEST=3/4 already applies fresh-reference delta itself.
            {% set cc_auto = 0.0 if mesh_test in [3,4] else auto_delta %}
            {% set total = bias + cc_auto %}
            {% if total|abs > 0.500 %}
                {action_raise_error('Calibration Center: профильная correction > 0.500 mm; применение заблокировано')}
            {% else %}
                SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=last_runtime_auto VALUE={cc_auto}
                _SET_GCODE_OFFSET_FAST Z_ADJUST={total} FROM=CALIBRATION_CENTER
                RUN_SHELL_COMMAND CMD=calibration_center_audit PARAMS="apply {slot} bias={bias} auto={cc_auto} mesh_test={mesh_test}"
                RESPOND PREFIX="info" MSG="Calibration Center: применён профиль {slot}; correction={total|round(4)} mm"
            {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro CC_FIRST_LAYER_CONTROLS]
description: Ручная проверка/подстройка первого слоя — только optional fallback
# These buttons adjust a running test/print. They are not the automatic calibration mechanism.
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Проверка первого слоя"
    RESPOND TYPE=command MSG="action:prompt_text Используйте только во время проверочного первого слоя. AUTO MEASURED и USER VERIFIED хранятся раздельно."
    RESPOND TYPE=command MSG="action:prompt_button -0.05|CC_LIVE_Z DELTA=-0.05|warning"
    RESPOND TYPE=command MSG="action:prompt_button -0.01|CC_LIVE_Z DELTA=-0.01|primary"
    RESPOND TYPE=command MSG="action:prompt_button +0.01|CC_LIVE_Z DELTA=0.01|primary"
    RESPOND TYPE=command MSG="action:prompt_button +0.05|CC_LIVE_Z DELTA=0.05|warning"
    RESPOND TYPE=command MSG="action:prompt_button Сохранить как USER VERIFIED|CC_VERIFY_CURRENT|success"
    RESPOND TYPE=command MSG="action:prompt_footer_button Закрыть|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro CC_LIVE_Z]
description: Optional first-layer live adjustment DELTA=+/-mm
gcode:
    {% set delta = params.DELTA|default(0.0)|float %}
    {% if printer.print_stats.state != 'printing' %}
        {action_raise_error('Calibration Center: live Z разрешён только во время печати проверочного слоя')}
    {% elif delta|abs > 0.050 %}
        {action_raise_error('Calibration Center: один шаг live Z ограничен +/-0.05 mm')}
    {% else %}
        {% set current_live = printer['gcode_macro _CC_STATE'].live_adjust|float %}
        {% if (current_live + delta)|abs > 0.300 %}
            {action_raise_error('Calibration Center: суммарная ручная подстройка > 0.300 mm заблокирована')}
        {% else %}
            _SET_GCODE_OFFSET_FAST Z_ADJUST={delta} FROM=CALIBRATION_CENTER_LIVE
            SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=live_adjust VALUE={current_live + delta}
            RESPOND PREFIX="info" MSG="Calibration Center: live Z {delta}; всего {current_live + delta} mm"
        {% endif %}
    {% endif %}

[gcode_macro CC_VERIFY_CURRENT]
description: Сохранить текущий первый слой как USER VERIFIED для активного профиля
gcode:
    {% set v = printer.save_variables.variables %}
    {% set slot = v['cc_active_profile']|default(0)|int %}
    {% set auto_ref = v['cc_p%d_auto_ref' % slot]|default(9999.0)|float if slot > 0 else 9999.0 %}
    {% set old_ref = v['cc_p%d_verified_ref' % slot]|default(9999.0)|float if slot > 0 else 9999.0 %}
    {% set old_bias = v['cc_p%d_verified_bias' % slot]|default(9999.0)|float if slot > 0 else 9999.0 %}
    {% set st = printer['gcode_macro _CC_STATE'] %}
    {% if printer.print_stats.state != 'printing' %}
        {action_raise_error('Calibration Center: USER VERIFIED сохраняется только во время реального проверочного первого слоя')}
    {% elif slot < 1 or v['cc_p%d_exists' % slot]|default(0)|int != 1 %}
        {action_raise_error('Calibration Center: активный профиль не найден')}
    {% elif auto_ref >= 9000.0 %}
        {action_raise_error('Calibration Center: сначала нужна успешная автоматическая серия probe')}
    {% else %}
        {% set current = printer.gcode_move.homing_origin.z|float %}
        # A never-verified profile has no previous process-bias anchor. In that
        # case the only deliberate evidence is the user's live first-layer
        # adjustment made after the AUTO MEASURED run. For an established
        # profile, derive the updated process bias from the captured baseline.
        {% if old_ref >= 9000.0 %}
            {% set new_bias = st.live_adjust|float %}
        {% else %}
            {% set new_bias = current - st.last_base_runtime|float - st.last_runtime_auto|float %}
        {% endif %}
        {% if new_bias|abs > 0.500 %}
            {action_raise_error('Calibration Center: проверенная correction > 0.500 mm; сохранение заблокировано')}
        {% else %}
            SAVE_VARIABLE VARIABLE=cc_p{slot}_prev_verified_ref VALUE={old_ref}
            SAVE_VARIABLE VARIABLE=cc_p{slot}_prev_verified_bias VALUE={old_bias}
            SAVE_VARIABLE VARIABLE=cc_p{slot}_verified_ref VALUE={auto_ref}
            SAVE_VARIABLE VARIABLE=cc_p{slot}_verified_bias VALUE={new_bias}
            SAVE_VARIABLE VARIABLE=cc_p{slot}_auto_delta VALUE=0.0
            SAVE_VARIABLE VARIABLE=cc_p{slot}_state VALUE=2
            SAVE_VARIABLE VARIABLE=cc_p{slot}_last_result VALUE=1
            RUN_SHELL_COMMAND CMD=calibration_center_audit PARAMS="verify {slot} ref={auto_ref} bias={new_bias}"
            RESPOND PREFIX="info" MSG="Calibration Center: USER VERIFIED сохранён. process correction={new_bias|round(4)} mm"
            RESPOND TYPE=command MSG="action:prompt_end"
        {% endif %}
    {% endif %}

[gcode_macro CC_ROLLBACK]
description: Вернуть предыдущую USER VERIFIED калибровку активного профиля
gcode:
    {% set v = printer.save_variables.variables %}
    {% set slot = v['cc_active_profile']|default(0)|int %}
    {% set current_ref = v['cc_p%d_verified_ref' % slot]|default(9999.0)|float if slot > 0 else 9999.0 %}
    {% set current_bias = v['cc_p%d_verified_bias' % slot]|default(9999.0)|float if slot > 0 else 9999.0 %}
    {% set prev_ref = v['cc_p%d_prev_verified_ref' % slot]|default(9999.0)|float if slot > 0 else 9999.0 %}
    {% set prev_bias = v['cc_p%d_prev_verified_bias' % slot]|default(9999.0)|float if slot > 0 else 9999.0 %}
    {% set auto_ref = v['cc_p%d_auto_ref' % slot]|default(9999.0)|float if slot > 0 else 9999.0 %}
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error('Calibration Center: rollback во время печати запрещён')}
    {% elif slot < 1 or prev_ref >= 9000.0 or prev_bias >= 9000.0 %}
        {action_raise_error('Calibration Center: предыдущая проверенная калибровка отсутствует')}
    {% else %}
        SAVE_VARIABLE VARIABLE=cc_p{slot}_verified_ref VALUE={prev_ref}
        SAVE_VARIABLE VARIABLE=cc_p{slot}_verified_bias VALUE={prev_bias}
        SAVE_VARIABLE VARIABLE=cc_p{slot}_prev_verified_ref VALUE={current_ref}
        SAVE_VARIABLE VARIABLE=cc_p{slot}_prev_verified_bias VALUE={current_bias}
        {% if auto_ref < 9000.0 %}
            SAVE_VARIABLE VARIABLE=cc_p{slot}_auto_delta VALUE={auto_ref - prev_ref}
        {% else %}
            SAVE_VARIABLE VARIABLE=cc_p{slot}_auto_delta VALUE=0.0
        {% endif %}
        SAVE_VARIABLE VARIABLE=cc_p{slot}_state VALUE=2
        SAVE_VARIABLE VARIABLE=cc_p{slot}_last_result VALUE=1
        RUN_SHELL_COMMAND CMD=calibration_center_audit PARAMS="rollback {slot} ref={prev_ref} bias={prev_bias}"
        RESPOND PREFIX="info" MSG="Calibration Center: предыдущая проверенная калибровка восстановлена"
    {% endif %}

[gcode_macro CC_ENABLE]
description: Включить применение профиля Calibration Center
# Does not disable stock Z-Mod calibration.
gcode:
    SAVE_VARIABLE VARIABLE=cc_enabled VALUE=1
    RESPOND PREFIX="info" MSG="Calibration Center: профильные corrections включены"

[gcode_macro CC_DISABLE]
description: Отключить применение профиля; штатная Z-Mod calibration остаётся доступна
gcode:
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error('Calibration Center: отключение во время печати запрещено')}
    {% else %}
        SAVE_VARIABLE VARIABLE=cc_enabled VALUE=0
        RESPOND PREFIX="info" MSG="Calibration Center отключён. Штатное поведение Z-Mod не изменено."
    {% endif %}
