# CALIBRATION-CENTER-001 print-time profile application and guided verification.

[gcode_shell_command calibration_center_first_layer]
command: /opt/config/mod_data/plugins/calibration_center/calibration_center/cc_audit.sh generate-first-layer
timeout: 10
verbose: False

[gcode_macro CC_APPLY_PROFILE]
description: Применить проверенную профильную correction после штатного Z-Mod START_PRINT
gcode:
    {% set v = printer.save_variables.variables %}
    {% set st = printer['gcode_macro _CC_STATE'] %}
    {% set slot = v['cc_active_profile']|default(0)|int %}
    {% set enabled = v['cc_enabled']|default(1)|int %}
    {% set exists = v['cc_p%d_exists' % slot]|default(0)|int == 1 if slot > 0 else False %}
    {% set verified = v['cc_p%d_state' % slot]|default(0)|int == 2 if slot > 0 else False %}
    {% set needs = v['cc_p%d_needs_calibration' % slot]|default(1)|int if slot > 0 else 1 %}
    {% set offsets = v['gcode_offsets']|default({}) %}
    {% set global_z = offsets['z']|default(printer.gcode_move.homing_origin.z)|float %}

    # A previous print may have ended before its delayed cleanup fired. Remove
    # only our stale G92 origin before calculating/applying the new print layer.
    {% if st.profile_origin_adjust|float|abs > 0.000001 %}
        _CC_PROFILE_TRANSIENT_RESTORE
    {% endif %}

    {% if enabled == 1 and exists %}
        {% if needs == 1 %}
            RESPOND TYPE=error MSG="Calibration Center: выбранный профиль требует успешной автоматической калибровки. Печать отменена; выполните калибровку или CC_DISABLE для штатного Z-Mod."
            CANCEL_PRINT
        {% else %}
            SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=last_base_runtime VALUE={printer.gcode_move.homing_origin.z|float}
            SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=last_runtime_auto VALUE=0.0
            SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=live_adjust VALUE=0.0
            {% if verified %}
                {% set bias = v['cc_p%d_verified_bias' % slot]|default(0.0)|float %}
                {% set auto_delta = v['cc_p%d_auto_delta' % slot]|default(0.0)|float %}
                {% set verified_global = v['cc_p%d_verified_global_z' % slot]|default(global_z)|float %}
                {% set global_comp = verified_global - global_z %}
                {% set mesh_test = v['mesh_test']|default(1)|int %}
                # MESH_TEST=3/4 already owns a differently anchored dynamic
                # AutoZOffset. Never double-apply the profile reference delta.
                {% set cc_auto = 0.0 if mesh_test in [3, 4] else auto_delta %}
                # verified_bias was learned on verified_global. If the user later
                # changes the global Z-Mod offset, normalize back to that verified
                # process baseline instead of silently invalidating every profile.
                {% set total = bias + cc_auto + global_comp %}
                {% if total|abs > 0.500 %}
                    {action_raise_error('Calibration Center: профильная correction > 0.500 mm; применение заблокировано')}
                {% else %}
                    SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=last_runtime_auto VALUE={cc_auto}
                    _CC_PROFILE_TRANSIENT_APPLY DELTA={total}
                    RUN_SHELL_COMMAND CMD=calibration_center_audit PARAMS="apply {slot} bias={bias} auto={cc_auto} global={global_z} verified_global={verified_global} global_comp={global_comp} mesh_test={mesh_test}"
                    RESPOND PREFIX="info" MSG="Calibration Center: профиль {slot}; transient correction={total|round(4)} mm, глобальный Z-Mod={global_z|round(4)} mm не изменяется"
                {% endif %}
            {% elif v['cc_p%d_state' % slot]|default(0)|int == 1 %}
                RESPOND PREFIX="info" MSG="Calibration Center: профиль AUTO MEASURED, но ещё не USER VERIFIED; process correction не применяется; глобальный Z-Mod={global_z|round(4)} mm"
            {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro CC_FIRST_LAYER_CONTROLS]
description: Guided built-in first-layer verification; when idle opens material presets
gcode:
    {% set v = printer.save_variables.variables %}
    {% set st = printer['gcode_macro _CC_STATE'] %}
    {% set slot = v['cc_active_profile']|default(0)|int %}
    {% set exists = v['cc_p%d_exists' % slot]|default(0)|int if slot > 0 else 0 %}
    {% set state = v['cc_p%d_state' % slot]|default(0)|int if slot > 0 else 0 %}
    {% set needs = v['cc_p%d_needs_calibration' % slot]|default(1)|int if slot > 0 else 1 %}
    {% set print_state = printer.print_stats.state|string %}
    {% set builtin_active = st.first_layer_active|int == 1 %}
    {% set review = st.first_layer_review|int == 1 %}
    {% set offsets = v['gcode_offsets']|default({}) %}
    {% set global_z = offsets['z']|default(printer.gcode_move.homing_origin.z)|float %}
    {% set live = st.live_adjust|float %}
    {% set profile_delta = st.profile_origin_adjust|float %}

    {% if builtin_active and (print_state == 'printing' or print_state == 'paused') %}
        RESPOND TYPE=command MSG="action:prompt_end"
        RESPOND TYPE=command MSG="action:prompt_begin Первый слой"
        RESPOND TYPE=command MSG="action:prompt_text {st.first_layer_material} | {st.first_layer_nozzle_temp|round(0)}/{st.first_layer_bed_temp|round(0)} C | сопло {st.first_layer_nozzle} mm"
        RESPOND TYPE=command MSG="action:prompt_text Глобальный Z-Mod: {global_z|round(4)} mm — Calibration Center его не изменяет"
        RESPOND TYPE=command MSG="action:prompt_text CC профиль: {profile_delta|round(4)} mm | test ΔZ: {live|round(4)} mm"

        {% if review %}
            RESPOND TYPE=command MSG="action:prompt_text Тест напечатан и стоит на паузе. Осмотрите слой и выберите результат."
            RESPOND TYPE=command MSG="action:prompt_button Сохранить|CC_FIRST_LAYER_ACCEPT|success"
            RESPOND TYPE=command MSG="action:prompt_button Без сохранения|CC_FIRST_LAYER_ABORT|warning"
        {% elif print_state == 'printing' %}
            RESPOND TYPE=command MSG="action:prompt_text Щели между линиями → уменьшить Z. Борозды/скрежет → увеличить Z. Максимальная test ΔZ ограничена ±0.10 mm."
            RESPOND TYPE=command MSG="action:prompt_button_group_start"
            RESPOND TYPE=command MSG="action:prompt_button -0.05|CC_LIVE_Z DELTA=-0.05|warning"
            RESPOND TYPE=command MSG="action:prompt_button -0.01|CC_LIVE_Z DELTA=-0.01|primary"
            RESPOND TYPE=command MSG="action:prompt_button +0.01|CC_LIVE_Z DELTA=0.01|primary"
            RESPOND TYPE=command MSG="action:prompt_button +0.05|CC_LIVE_Z DELTA=0.05|warning"
            RESPOND TYPE=command MSG="action:prompt_button_group_end"
            RESPOND TYPE=command MSG="action:prompt_button Отмена|CC_FIRST_LAYER_ABORT|warning"
        {% endif %}
        RESPOND TYPE=command MSG="action:prompt_footer_button Закрыть|_CC_PROMPT_CLOSE"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% elif print_state in ['printing', 'paused'] %}
        {action_raise_error('Calibration Center: Z-подстройка разрешена только внутри встроенного first-layer test; для обычной печати CC не перехватывает глобальный Z-offset')}
    {% elif exists != 1 %}
        {action_raise_error('Calibration Center: активный профиль не найден')}
    {% elif needs == 1 or state not in [1, 2] %}
        {action_raise_error('Calibration Center: сначала нужна успешная автоматическая калибровка профиля')}
    {% else %}
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_active VALUE=0
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_verified VALUE=0
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_review VALUE=0
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=live_adjust VALUE=0.0
        RESPOND TYPE=command MSG="action:prompt_end"
        RESPOND TYPE=command MSG="action:prompt_begin Первый слой"
        RESPOND TYPE=command MSG="action:prompt_text Какой материал загружен? Температуры для проверки будут подставлены автоматически."
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button PLA|CC_FIRST_LAYER_PRESET MATERIAL=PLA|primary"
        RESPOND TYPE=command MSG="action:prompt_button PETG|CC_FIRST_LAYER_PRESET MATERIAL=PETG|primary"
        RESPOND TYPE=command MSG="action:prompt_button ABS|CC_FIRST_LAYER_PRESET MATERIAL=ABS|primary"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
        RESPOND TYPE=command MSG="action:prompt_button ASA|CC_FIRST_LAYER_PRESET MATERIAL=ASA|primary"
        RESPOND TYPE=command MSG="action:prompt_button TPU|CC_FIRST_LAYER_PRESET MATERIAL=TPU|primary"
        RESPOND TYPE=command MSG="action:prompt_button Другой|CC_FIRST_LAYER_ADVANCED|secondary"
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_footer_button Назад|CALIBRATION_CENTER"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro CC_FIRST_LAYER_PRESET]
description: Show a beginner-friendly material preset before starting the built-in test
gcode:
    {% set material = params.MATERIAL|default('PLA')|string|upper %}
    {% if material == 'PLA' %}
        {% set nozzle_temp = 210 %}
        {% set bed_temp = 60 %}
    {% elif material == 'PETG' %}
        {% set nozzle_temp = 240 %}
        {% set bed_temp = 75 %}
    {% elif material == 'ABS' %}
        {% set nozzle_temp = 250 %}
        {% set bed_temp = 100 %}
    {% elif material == 'ASA' %}
        {% set nozzle_temp = 250 %}
        {% set bed_temp = 100 %}
    {% elif material == 'TPU' %}
        {% set nozzle_temp = 225 %}
        {% set bed_temp = 50 %}
    {% else %}
        {action_raise_error('Calibration Center: неизвестный material preset')}
    {% endif %}

    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin {material} — тест Z"
    RESPOND TYPE=command MSG="action:prompt_text Сопло {nozzle_temp} C | стол {bed_temp} C. Это стартовый preset для проверки первого слоя."
    RESPOND TYPE=command MSG="action:prompt_text Печатается небольшой встроенный patch через обычный Z-Mod START_PRINT; глобальный Z-offset тест не меняет."
    RESPOND TYPE=command MSG="action:prompt_button Старт|CC_FIRST_LAYER_TEST MATERIAL={material} NOZZLE_TEMP={nozzle_temp} BED_TEMP={bed_temp}|success"
    RESPOND TYPE=command MSG="action:prompt_footer_button Назад|CC_FIRST_LAYER_CONTROLS"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro CC_FIRST_LAYER_ADVANCED]
description: Explain optional manual temperature override without exposing it to beginners by default
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin Ручной режим"
    RESPOND TYPE=command MSG="action:prompt_text CC_FIRST_LAYER_TEST MATERIAL=CUSTOM NOZZLE_TEMP=... BED_TEMP=..."
    RESPOND TYPE=command MSG="action:prompt_text Пределы: сопло 170..280 C, стол 0..110 C."
    RESPOND TYPE=command MSG="action:prompt_footer_button Назад|CC_FIRST_LAYER_CONTROLS"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro CC_FIRST_LAYER_TEST]
description: Generate and print a built-in first-layer patch using normal Z-Mod START_PRINT
gcode:
    {% set v = printer.save_variables.variables %}
    {% set slot = v['cc_active_profile']|default(0)|int %}
    {% set exists = v['cc_p%d_exists' % slot]|default(0)|int if slot > 0 else 0 %}
    {% set state = v['cc_p%d_state' % slot]|default(0)|int if slot > 0 else 0 %}
    {% set needs = v['cc_p%d_needs_calibration' % slot]|default(1)|int if slot > 0 else 1 %}
    {% set nozzle = v['cc_p%d_nozzle' % slot]|default(0.0)|float if slot > 0 else 0.0 %}
    {% set material = params.MATERIAL|default('CUSTOM')|string|upper %}
    {% set nozzle_temp = params.NOZZLE_TEMP|default(0)|float %}
    {% set bed_temp = params.BED_TEMP|default(0)|float %}
    {% set sd_path = printer.configfile.settings.virtual_sdcard.path|string %}
    {% set mesh_name = printer.bed_mesh.profile_name|string if printer.bed_mesh.profile_name else '' %}

    {% if printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error('Calibration Center: нельзя запускать встроенный тест во время другой печати')}
    {% elif exists != 1 or slot < 1 %}
        {action_raise_error('Calibration Center: активный профиль не найден')}
    {% elif needs == 1 or state not in [1, 2] %}
        {action_raise_error('Calibration Center: сначала нужна успешная автоматическая калибровка')}
    {% elif mesh_name == '' %}
        {action_raise_error('Calibration Center: карта стола не загружена. Сначала выполните автоматическую калибровку/загрузите рабочую bed mesh.')}
    {% elif material not in ['PLA', 'PETG', 'ABS', 'ASA', 'TPU', 'CUSTOM'] %}
        {action_raise_error('Calibration Center: неподдерживаемый материал')}
    {% elif nozzle_temp < 170 or nozzle_temp > 280 %}
        {action_raise_error('Calibration Center: NOZZLE_TEMP вне диапазона 170..280 C')}
    {% elif bed_temp < 0 or bed_temp > 110 %}
        {action_raise_error('Calibration Center: BED_TEMP вне диапазона 0..110 C')}
    {% elif nozzle < 0.20 or nozzle > 1.20 %}
        {action_raise_error('Calibration Center: встроенный тест поддерживает сопла 0.20..1.20 mm')}
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_end"
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_active VALUE=0
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_verified VALUE=0
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_review VALUE=0
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=live_adjust VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_material VALUE='"{material}"'
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_nozzle_temp VALUE={nozzle_temp}
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_bed_temp VALUE={bed_temp}
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_nozzle VALUE={nozzle}
        SAVE_VARIABLE VARIABLE=cc_last_material VALUE='"{material}"'
        SAVE_VARIABLE VARIABLE=cc_last_nozzle_temp VALUE={nozzle_temp}
        SAVE_VARIABLE VARIABLE=cc_last_bed_temp VALUE={bed_temp}
        RUN_SHELL_COMMAND CMD=calibration_center_first_layer PARAMS="{sd_path} {material} {nozzle_temp} {bed_temp} {nozzle}"
        RUN_SHELL_COMMAND CMD=calibration_center_audit PARAMS="first_layer_generate {slot} material={material} nozzle={nozzle} nozzle_temp={nozzle_temp} bed_temp={bed_temp} mesh={mesh_name}"
        RESPOND PREFIX="info" MSG="Calibration Center: запускаю тест первого слоя ({material}, {nozzle_temp|round(0)}/{bed_temp|round(0)} C)"
        SDCARD_PRINT_FILE FILENAME="Calibration_Center_First_Layer.gcode"
    {% endif %}

[gcode_macro CC_FIRST_LAYER_TEST_BEGIN]
description: Internal marker executed by the generated virtual-SD test after START_PRINT
gcode:
    {% set material = params.MATERIAL|default('CUSTOM')|string|upper %}
    {% set nozzle_temp = params.NOZZLE_TEMP|default(0)|float %}
    {% set bed_temp = params.BED_TEMP|default(0)|float %}
    {% set nozzle = params.NOZZLE|default(0.4)|float %}
    {% set layer = nozzle * 0.50 %}
    {% if layer < 0.15 %}{% set layer = 0.15 %}{% endif %}
    {% if layer > 0.40 %}{% set layer = 0.40 %}{% endif %}
    {% if printer.print_stats.state != 'printing' %}
        {action_raise_error('Calibration Center: встроенный first-layer pattern должен выполняться как virtual-SD печать')}
    {% else %}
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_active VALUE=1
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_verified VALUE=0
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_review VALUE=0
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_material VALUE='"{material}"'
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_nozzle_temp VALUE={nozzle_temp}
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_bed_temp VALUE={bed_temp}
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_nozzle VALUE={nozzle}
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_height VALUE={layer}
        RUN_SHELL_COMMAND CMD=calibration_center_audit PARAMS="first_layer_begin material={material} nozzle={nozzle} nozzle_temp={nozzle_temp} bed_temp={bed_temp} global_z={printer.gcode_move.homing_origin.z|float}"
        RESPOND PREFIX="info" MSG="Calibration Center: тест начат; test ΔZ изолирована от глобального Z-Mod offset"
        CC_FIRST_LAYER_CONTROLS
    {% endif %}

[gcode_macro CC_LIVE_Z]
description: Built-in first-layer transient adjustment DELTA=+/-mm; never persists Z-Mod offset
gcode:
    {% set delta = params.DELTA|default(0.0)|float %}
    {% set st = printer['gcode_macro _CC_STATE'] %}
    {% if st.first_layer_active|int != 1 or printer.print_stats.state != 'printing' %}
        {action_raise_error('Calibration Center: live Z доступен только во время встроенного first-layer test')}
    {% elif st.first_layer_review|int == 1 %}
        {action_raise_error('Calibration Center: тест уже напечатан; Z после печати не меняется')}
    {% else %}
        _CC_FIRST_LAYER_TRANSIENT_STEP DELTA={delta}
        # Helix closes an action prompt after a button press. Reopen after the
        # separate transient-step macro executes so fresh values are rendered.
        CC_FIRST_LAYER_CONTROLS
    {% endif %}

[gcode_macro CC_FIRST_LAYER_TEST_REVIEW]
description: Pause the generated test after the patch so the operator can inspect it before accepting
gcode:
    {% set st = printer['gcode_macro _CC_STATE'] %}
    {% if st.first_layer_active|int != 1 or printer.print_stats.state != 'printing' %}
        {action_raise_error('Calibration Center: review доступен только в конце встроенного first-layer test')}
    {% else %}
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_review VALUE=1
        RUN_SHELL_COMMAND CMD=calibration_center_audit PARAMS="first_layer_review live={st.live_adjust|float} persistent_z={printer.gcode_move.homing_origin.z|float}"
        PAUSE
        CC_FIRST_LAYER_CONTROLS
    {% endif %}

[gcode_macro CC_VERIFY_CURRENT]
description: Save review result as USER VERIFIED without writing global Z-Mod offset
gcode:
    {% set v = printer.save_variables.variables %}
    {% set slot = v['cc_active_profile']|default(0)|int %}
    {% set auto_ref = v['cc_p%d_auto_ref' % slot]|default(9999.0)|float if slot > 0 else 9999.0 %}
    {% set auto_format = v['cc_p%d_auto_probe_format' % slot]|default(-1)|int if slot > 0 else -1 %}
    {% set old_ref = v['cc_p%d_verified_ref' % slot]|default(9999.0)|float if slot > 0 else 9999.0 %}
    {% set old_bias = v['cc_p%d_verified_bias' % slot]|default(9999.0)|float if slot > 0 else 9999.0 %}
    {% set old_format = v['cc_p%d_verified_probe_format' % slot]|default(-1)|int if slot > 0 else -1 %}
    {% set offsets = v['gcode_offsets']|default({}) %}
    {% set global_z = offsets['z']|default(printer.gcode_move.homing_origin.z)|float %}
    {% set old_global = v['cc_p%d_verified_global_z' % slot]|default(global_z)|float if slot > 0 else global_z %}
    {% set st = printer['gcode_macro _CC_STATE'] %}
    {% set print_state = printer.print_stats.state|string %}
    {% set builtin_review = st.first_layer_active|int == 1 and st.first_layer_review|int == 1 and print_state == 'paused' %}
    {% if not builtin_review %}
        {action_raise_error('Calibration Center: USER VERIFIED сохраняется только после review-паузы встроенного first-layer test')}
    {% elif slot < 1 or v['cc_p%d_exists' % slot]|default(0)|int != 1 %}
        {action_raise_error('Calibration Center: активный профиль не найден')}
    {% elif auto_ref >= 9000.0 or auto_format not in [0, 1] %}
        {action_raise_error('Calibration Center: сначала нужна успешная автоматическая серия probe текущего формата')}
    {% else %}
        {% if old_ref >= 9000.0 or old_format != auto_format or old_bias >= 9000.0 %}
            {% set new_bias = st.live_adjust|float %}
        {% else %}
            {% set new_bias = old_bias + st.live_adjust|float %}
        {% endif %}
        {% if new_bias|abs > 0.500 %}
            {action_raise_error('Calibration Center: проверенная process correction > 0.500 mm; сохранение заблокировано')}
        {% else %}
            SAVE_VARIABLE VARIABLE=cc_p{slot}_prev_verified_ref VALUE={old_ref}
            SAVE_VARIABLE VARIABLE=cc_p{slot}_prev_verified_bias VALUE={old_bias}
            SAVE_VARIABLE VARIABLE=cc_p{slot}_prev_verified_probe_format VALUE={old_format}
            SAVE_VARIABLE VARIABLE=cc_p{slot}_prev_verified_global_z VALUE={old_global}
            SAVE_VARIABLE VARIABLE=cc_p{slot}_verified_ref VALUE={auto_ref}
            SAVE_VARIABLE VARIABLE=cc_p{slot}_verified_bias VALUE={new_bias}
            SAVE_VARIABLE VARIABLE=cc_p{slot}_verified_probe_format VALUE={auto_format}
            SAVE_VARIABLE VARIABLE=cc_p{slot}_verified_global_z VALUE={global_z}
            SAVE_VARIABLE VARIABLE=cc_p{slot}_auto_delta VALUE=0.0
            SAVE_VARIABLE VARIABLE=cc_p{slot}_state VALUE=2
            SAVE_VARIABLE VARIABLE=cc_p{slot}_needs_calibration VALUE=0
            SAVE_VARIABLE VARIABLE=cc_p{slot}_last_result VALUE=1
            SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_verified VALUE=1
            RUN_SHELL_COMMAND CMD=calibration_center_audit PARAMS="verify {slot} ref={auto_ref} bias={new_bias} format={auto_format} global_z={global_z} live={st.live_adjust|float}"
            RESPOND PREFIX="info" MSG="Calibration Center: USER VERIFIED сохранён. process correction={new_bias|round(4)} mm; global Z-Mod={global_z|round(4)} mm не изменён"
            RESPOND TYPE=command MSG="action:prompt_end"
        {% endif %}
    {% endif %}

[gcode_macro CC_FIRST_LAYER_ACCEPT]
description: Save the built-in verification result and stop the generated test print
gcode:
    {% set st = printer['gcode_macro _CC_STATE'] %}
    {% if st.first_layer_active|int != 1 or st.first_layer_review|int != 1 or printer.print_stats.state != 'paused' %}
        {action_raise_error('Calibration Center: Сохранить доступно только на review-паузе встроенного first-layer test')}
    {% else %}
        CC_VERIFY_CURRENT
        RUN_SHELL_COMMAND CMD=calibration_center_audit PARAMS="first_layer_accept live={st.live_adjust|float}"
        _CC_FIRST_LAYER_RESTORE_RUNTIME
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_active VALUE=0
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_review VALUE=0
        CANCEL_PRINT
    {% endif %}

[gcode_macro CC_FIRST_LAYER_ABORT]
description: Abort the generated first-layer test without saving a new verified bias
gcode:
    {% set st = printer['gcode_macro _CC_STATE'] %}
    {% if st.first_layer_active|int != 1 or printer.print_stats.state not in ['printing', 'paused'] %}
        {action_raise_error('Calibration Center: встроенный тест первого слоя сейчас не выполняется')}
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_end"
        RUN_SHELL_COMMAND CMD=calibration_center_audit PARAMS="first_layer_abort live={st.live_adjust|float}"
        _CC_FIRST_LAYER_RESTORE_RUNTIME
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_active VALUE=0
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_verified VALUE=0
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_review VALUE=0
        CANCEL_PRINT
    {% endif %}

[gcode_macro CC_FIRST_LAYER_TEST_FILE_END]
description: Internal natural end marker for the generated first-layer file
gcode:
    {% set st = printer['gcode_macro _CC_STATE'] %}
    RESPOND TYPE=command MSG="action:prompt_end"
    _CC_FIRST_LAYER_RESTORE_RUNTIME
    {% if st.first_layer_verified|int == 1 %}
        RESPOND PREFIX="info" MSG="Calibration Center: встроенный тест завершён; USER VERIFIED уже сохранён"
        RUN_SHELL_COMMAND CMD=calibration_center_audit PARAMS="first_layer_end verified=1"
    {% else %}
        RESPOND TYPE=error MSG="Calibration Center: тест завершён без USER VERIFIED; test ΔZ удалена без изменения глобального Z-offset."
        RUN_SHELL_COMMAND CMD=calibration_center_audit PARAMS="first_layer_end verified=0 live={st.live_adjust|float}"
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_active VALUE=0
    SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_review VALUE=0

[gcode_macro CC_ROLLBACK]
description: Вернуть предыдущую USER VERIFIED калибровку активного профиля
gcode:
    {% set v = printer.save_variables.variables %}
    {% set slot = v['cc_active_profile']|default(0)|int %}
    {% set current_ref = v['cc_p%d_verified_ref' % slot]|default(9999.0)|float if slot > 0 else 9999.0 %}
    {% set current_bias = v['cc_p%d_verified_bias' % slot]|default(9999.0)|float if slot > 0 else 9999.0 %}
    {% set current_format = v['cc_p%d_verified_probe_format' % slot]|default(-1)|int if slot > 0 else -1 %}
    {% set current_global = v['cc_p%d_verified_global_z' % slot]|default(9999.0)|float if slot > 0 else 9999.0 %}
    {% set prev_ref = v['cc_p%d_prev_verified_ref' % slot]|default(9999.0)|float if slot > 0 else 9999.0 %}
    {% set prev_bias = v['cc_p%d_prev_verified_bias' % slot]|default(9999.0)|float if slot > 0 else 9999.0 %}
    {% set prev_format = v['cc_p%d_prev_verified_probe_format' % slot]|default(-1)|int if slot > 0 else -1 %}
    {% set prev_global = v['cc_p%d_prev_verified_global_z' % slot]|default(9999.0)|float if slot > 0 else 9999.0 %}
    {% set auto_ref = v['cc_p%d_auto_ref' % slot]|default(9999.0)|float if slot > 0 else 9999.0 %}
    {% set auto_format = v['cc_p%d_auto_probe_format' % slot]|default(-1)|int if slot > 0 else -1 %}
    {% set last_result = v['cc_p%d_last_result' % slot]|default(0)|int if slot > 0 else 0 %}
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error('Calibration Center: rollback во время печати запрещён')}
    {% elif slot < 1 or prev_ref >= 9000.0 or prev_bias >= 9000.0 %}
        {action_raise_error('Calibration Center: предыдущая проверенная калибровка отсутствует')}
    {% elif prev_format != auto_format %}
        {action_raise_error('Calibration Center: rollback между разными форматами probe-координаты запрещён; требуется новая проверка первого слоя')}
    {% else %}
        SAVE_VARIABLE VARIABLE=cc_p{slot}_verified_ref VALUE={prev_ref}
        SAVE_VARIABLE VARIABLE=cc_p{slot}_verified_bias VALUE={prev_bias}
        SAVE_VARIABLE VARIABLE=cc_p{slot}_verified_probe_format VALUE={prev_format}
        SAVE_VARIABLE VARIABLE=cc_p{slot}_verified_global_z VALUE={prev_global}
        SAVE_VARIABLE VARIABLE=cc_p{slot}_prev_verified_ref VALUE={current_ref}
        SAVE_VARIABLE VARIABLE=cc_p{slot}_prev_verified_bias VALUE={current_bias}
        SAVE_VARIABLE VARIABLE=cc_p{slot}_prev_verified_probe_format VALUE={current_format}
        SAVE_VARIABLE VARIABLE=cc_p{slot}_prev_verified_global_z VALUE={current_global}
        {% if auto_ref < 9000.0 %}
            SAVE_VARIABLE VARIABLE=cc_p{slot}_auto_delta VALUE={auto_ref - prev_ref}
        {% else %}
            SAVE_VARIABLE VARIABLE=cc_p{slot}_auto_delta VALUE=0.0
        {% endif %}
        SAVE_VARIABLE VARIABLE=cc_p{slot}_state VALUE=2
        {% if last_result != 3 %}
            SAVE_VARIABLE VARIABLE=cc_p{slot}_needs_calibration VALUE=0
            SAVE_VARIABLE VARIABLE=cc_p{slot}_last_result VALUE=1
        {% endif %}
        RUN_SHELL_COMMAND CMD=calibration_center_audit PARAMS="rollback {slot} ref={prev_ref} bias={prev_bias} format={prev_format} global={prev_global}"
        RESPOND PREFIX="info" MSG="Calibration Center: предыдущая проверенная калибровка восстановлена"
    {% endif %}

[gcode_macro CC_ENABLE]
description: Включить применение профиля Calibration Center
gcode:
    SAVE_VARIABLE VARIABLE=cc_enabled VALUE=1
    RESPOND PREFIX="info" MSG="Calibration Center: профильные corrections включены"

[gcode_macro CC_DISABLE]
description: Отключить применение профиля; штатная Z-Mod calibration остаётся доступна
gcode:
    {% set st = printer['gcode_macro _CC_STATE'] %}
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error('Calibration Center: отключение во время печати запрещено')}
    {% else %}
        {% if st.profile_origin_adjust|float|abs > 0.000001 %}
            _CC_PROFILE_TRANSIENT_RESTORE
        {% endif %}
        SAVE_VARIABLE VARIABLE=cc_enabled VALUE=0
        RESPOND PREFIX="info" MSG="Calibration Center отключён. Штатное поведение Z-Mod не изменено."
    {% endif %}
