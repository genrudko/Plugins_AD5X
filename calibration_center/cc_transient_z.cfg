# CALIBRATION-CENTER-001 transient Z-coordinate layer.
#
# Z-Mod/HelixScreen intentionally persist their public SET_GCODE_OFFSET path.
# Calibration Center must never put profile/test corrections into that global
# value. These helpers use G92 (G-code base_position) instead. Klipper keeps G92
# origin and SET_GCODE_OFFSET homing_origin as separate pieces of G-code state.

[gcode_macro _CC_PROFILE_TRANSIENT_APPLY]
description: Internal: apply a print-only profile correction without touching Z-offset persistence
gcode:
    {% set delta = params.DELTA|default(0.0)|float %}
    {% set st = printer['gcode_macro _CC_STATE'] %}
    {% if delta|abs > 0.500 %}
        {action_raise_error('Calibration Center: transient profile correction > 0.500 mm blocked')}
    {% elif st.profile_origin_adjust|float|abs > 0.000001 %}
        {action_raise_error('Calibration Center: transient profile origin already active')}
    {% elif delta|abs > 0.000001 %}
        {% set z = printer.gcode_move.gcode_position.z|float %}
        # To emulate a +delta future-Z translation without changing homing_origin,
        # increase base_position by delta: G92 target = current_gcode_z - delta.
        G92 Z={z - delta}
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=profile_origin_adjust VALUE={delta}
        UPDATE_DELAYED_GCODE ID=_CC_PROFILE_ORIGIN_WATCHDOG DURATION=5
        RUN_SHELL_COMMAND CMD=calibration_center_audit PARAMS="profile_origin_apply delta={delta} global_z={printer.gcode_move.homing_origin.z|float}"
    {% endif %}

[gcode_macro _CC_PROFILE_TRANSIENT_RESTORE]
description: Internal: restore G92 profile origin without moving the toolhead
gcode:
    {% set st = printer['gcode_macro _CC_STATE'] %}
    {% set delta = st.profile_origin_adjust|float %}
    {% if delta|abs > 0.000001 %}
        {% set z = printer.gcode_move.gcode_position.z|float %}
        G92 Z={z + delta}
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=profile_origin_adjust VALUE=0.0
        RUN_SHELL_COMMAND CMD=calibration_center_audit PARAMS="profile_origin_restore delta={delta}"
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_CC_PROFILE_ORIGIN_WATCHDOG DURATION=0

[delayed_gcode _CC_PROFILE_ORIGIN_WATCHDOG]
gcode:
    {% set st = printer['gcode_macro _CC_STATE'] %}
    {% set print_state = printer.print_stats.state|string %}
    {% if st.profile_origin_adjust|float|abs > 0.000001 %}
        {% if print_state in ['printing', 'paused'] %}
            UPDATE_DELAYED_GCODE ID=_CC_PROFILE_ORIGIN_WATCHDOG DURATION=5
        {% else %}
            _CC_PROFILE_TRANSIENT_RESTORE
        {% endif %}
    {% endif %}

[gcode_macro _CC_FIRST_LAYER_TRANSIENT_STEP]
description: Internal: apply one immediate built-in-test Z step without changing persistent Z offset
gcode:
    {% set delta = params.DELTA|default(0.0)|float %}
    {% set st = printer['gcode_macro _CC_STATE'] %}
    {% set current_live = st.live_adjust|float %}
    {% set new_live = current_live + delta %}
    {% set layer = st.first_layer_height|float %}
    {% set down_limit = 0.100 if layer >= 0.200 else layer * 0.50 %}
    {% if st.first_layer_active|int != 1 or printer.print_stats.state != 'printing' %}
        {action_raise_error('Calibration Center: transient Z step разрешён только во время встроенного first-layer test')}
    {% elif st.first_layer_review|int == 1 %}
        {action_raise_error('Calibration Center: тест уже на review; Z больше не меняется')}
    {% elif delta|abs > 0.050 %}
        {action_raise_error('Calibration Center: один test Z step ограничен +/-0.05 mm')}
    {% elif new_live < -down_limit or new_live > 0.100 %}
        {action_raise_error('Calibration Center: суммарная test ΔZ вышла за безопасный диапазон')}
    {% else %}
        {% set z = printer.gcode_move.gcode_position.z|float %}
        # G92 changes future absolute-Z mapping; the matching relative move makes
        # this step visible immediately while keeping the logical layer Z stable.
        G92 Z={z - delta}
        G91
        G1 Z{delta} F300
        G90
        M400
        SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=live_adjust VALUE={new_live}
        RUN_SHELL_COMMAND CMD=calibration_center_audit PARAMS="first_layer_live delta={delta} total={new_live} persistent_z={printer.gcode_move.homing_origin.z|float}"
    {% endif %}

[gcode_macro _CC_FIRST_LAYER_RESTORE_RUNTIME]
description: Remove only the built-in test G92 delta; never write Z-Mod persistent offset
gcode:
    {% set st = printer['gcode_macro _CC_STATE'] %}
    {% set live = st.live_adjust|float %}
    {% if live|abs > 0.000001 %}
        {% set z = printer.gcode_move.gcode_position.z|float %}
        # No physical move here: review/abort paths lift or cancel separately.
        G92 Z={z + live}
        RUN_SHELL_COMMAND CMD=calibration_center_audit PARAMS="first_layer_origin_restore live={live} persistent_z={printer.gcode_move.homing_origin.z|float}"
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=live_adjust VALUE=0.0

[delayed_gcode _CC_FIRST_LAYER_WATCHDOG]
gcode:
    {% set st = printer['gcode_macro _CC_STATE'] %}
    {% set print_state = printer.print_stats.state|string %}
    {% if st.first_layer_active|int == 1 %}
        {% if print_state in ['printing', 'paused'] %}
            UPDATE_DELAYED_GCODE ID=_CC_FIRST_LAYER_WATCHDOG DURATION=2
        {% else %}
            RESPOND TYPE=command MSG="action:prompt_end"
            RUN_SHELL_COMMAND CMD=calibration_center_audit PARAMS="first_layer_external_end state={print_state} live={st.live_adjust|float}"
            _CC_FIRST_LAYER_RESTORE_RUNTIME
            SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_active VALUE=0
            SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_verified VALUE=0
            SET_GCODE_VARIABLE MACRO=_CC_STATE VARIABLE=first_layer_review VALUE=0
            RESPOND PREFIX="info" MSG="Calibration Center: внешний cancel/end; временная test ΔZ удалена без изменения глобального Z-offset"
        {% endif %}
    {% endif %}
