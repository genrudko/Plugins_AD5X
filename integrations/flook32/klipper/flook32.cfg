#####################################################################
# FLOOK32 chamber controller - AD5X native heater integration
#####################################################################
# This custom section is intentionally NOT [heater_generic].
# FLOOK32/ESP32 owns SSR control and all thermal protections; Klipper
# only exposes the remote device through its standard heaters API.

[flook32 chamber]
auto_discover: True
min_temp: 0
max_temp: 65
wait_delta: 2

# Slicer integration is enabled only after the native-heater field test.
# Planned commands:
#   SET_HEATER_TEMPERATURE HEATER=chamber TARGET=45
#   TEMPERATURE_WAIT SENSOR="flook32 chamber" MINIMUM=43
